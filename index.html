        + '</div>' : '<div class="muted" style="margin-top:5px">한 번 입력해두면 다음부터는 눌러서 고를 수 있어요</div>')
    + '</div>'
    + '<div class="card"><div class="sec-t">📏 레시피에서 쓰는 단위 (선택)</div>'
    + '<div class="muted" style="margin-bottom:8px">구매는 봉·박스로 해도 조리는 장·개로 쓰죠. '
    + '여기에 적어두면 레시피에서 자동으로 그 단위가 나오고, 창고 재고로 환산해 줍니다.</div>'
    + '<div class="grid2">'
    + '<div class="f"><label>사용 단위</label><input id="iUU" value="'+(i?esc(i.useUnit||""):"")+'" placeholder="장 / 개 / g"></div>'
    + '<div class="f"><label>1'+(i&&i.unit?esc(i.unit):"구매단위")+' = ?</label>'
    + '<input type="number" step="any" id="iPU" value="'+(i&&num(i.perUnit)?num(i.perUnit):"")+'" placeholder="예: 20"></div></div>'
    + '<div class="muted">예) 부산어묵 1봉 = 20장 → 사용 단위 <b>장</b>, 값 <b>20</b></div></div>'
    + '<div class="f"><label>유통기한 (선택)</label><input type="date" id="iE" value="'+(i?esc(i.exp||""):"")+'">'
    + expQuickChips("iE")+'</div>'
    + '<div class="f"><label>메모</label><input id="iMemo" value="'+(i?esc(i.memo):"")+'" placeholder="보관 위치 / 규격"></div>'
    + '<div class="muted" style="margin-bottom:12px">💡 최소 보유량을 넣으면 재고가 그 아래로 떨어질 때 자동으로 발주 알림이 떠요.</div>'
    + '<button class="btn full" onclick="saveItem(\''+(id||"")+'\')">저장</button>'
    + ((id&&isMgr())? '<button class="btn g full" style="margin-top:8px;color:var(--bad)" onclick="delItem(\''+id+'\')">삭제</button>':'');
  sheet(id?"자재 수정":"자재 추가", b);
  drawItemCats();
}
function saveItem(id){
  const n=document.getElementById("iN").value.trim();
  if(!n){ toast("자재명을 입력하세요"); return; }
  let i = id? stockById(id):null;
  if(!i){ i={id:uid()}; data.stock.push(i); }
  i.name=n;
  i.cat=tmpItemCat;
  i.unit=document.getElementById("iU").value.trim();
  i.stock=num(document.getElementById("iS").value);
  i.min=num(document.getElementById("iM").value);
  i.price=num(document.getElementById("iP").value);
  i.vendor=document.getElementById("iV").value.trim();
  const _e=document.getElementById("iE"); if(_e) i.exp=_e.value;
  const _uu=document.getElementById("iUU"); if(_uu) i.useUnit=_uu.value.trim();
  const _pu=document.getElementById("iPU"); if(_pu) i.perUnit=num(_pu.value);
  i.memo=document.getElementById("iMemo").value;
  save(); closeSheet(); render(); toast("저장했어요 ✓");
}
function delItem(id){
  if(!confirm("이 자재를 삭제할까요? 레시피 연동도 해제됩니다.")) return;
  data.stock = data.stock.filter(function(x){ return x.id!==id; });
  data.recipes.forEach(function(r){ (r.ings||[]).forEach(function(g){ if(g.sid===id) g.sid=""; }); });
  save(); closeSheet(); render();
}
function copyVendorOrder(v){
  const t = (window.ORDER_BY_VENDOR||{})[v];
  if(t) copyTxt(t); else toast("발주 내용이 없어요");
}
function orderSheet(){
  const low = data.stock.filter(isLow);
  if(!low.length){ toast("발주가 필요한 자재가 없어요"); return; }
  const byV={};
  low.forEach(function(i){ const v=i.vendor||"거래처 미지정"; (byV[v]=byV[v]||[]).push(i); });
  let t = "📦 "+(data.settings.store||"")+" 발주 요청 ("+dLabel(today())+")\n";
  let b = '<div class="card tight"><div class="muted">거래처별로 따로 복사해서 카톡에 붙여넣으세요</div></div>';
  window.ORDER_BY_VENDOR = {};
  for(const v in byV){
    let vt = "["+(data.settings.store||"")+"] 발주 요청 ("+dLabel(today())+")\n";
    t += "\n["+v+"]\n";
    b += '<div class="card"><div class="row" style="margin-bottom:4px">'
      + '<div class="sec-t sp" style="margin:0">'+esc(v)+' ('+byV[v].length+')</div>'
      + '<button class="btn xs" onclick="copyVendorOrder(\''+jsq(v)+'\')">📋 복사</button></div>';
    byV[v].forEach(function(i){
      const need = Math.max(num(i.min)*2 - num(i.stock), num(i.min));
      const rec = Math.ceil(need*10)/10;
      const line = "· "+i.name+" "+rec+(i.unit||"")+" (현재 "+num(i.stock)+(i.unit||"")+")";
      t += line+"\n"; vt += line+"\n";
      b += '<div class="li"><div class="sp"><div class="li-t">'+esc(i.name)+'</div>'
        + '<div class="li-s">현재 '+num(i.stock)+esc(i.unit||"")+' · 최소 '+num(i.min)+esc(i.unit||"")+'</div></div>'
        + '<span class="bdg bad">'+rec+esc(i.unit||"")+' 주문</span></div>';
    });
    b += '</div>';
    window.ORDER_BY_VENDOR[v] = vt.trim();
  }
  b += '<button class="btn g full" onclick="copyTxt(ORDER_TXT)">📋 전체 발주서 복사</button>';
  window.ORDER_TXT = t.trim();
  sheet("발주서 ("+low.length+"개)", b);
}
</script>
<script>
/* ═══════════════ 체크리스트 ═══════════════ */
function chkPeriodKey(){
  if(chkPeriod==="daily")  return dateKey(chkDate);
  if(chkPeriod==="weekly") return weekKeyOf(dateKey(chkDate));
  return monthKey(chkDate);
}
function chkKey(){ return chkArea+"|"+chkPeriod+"|"+chkPeriodKey(); }
function weekOfMonth(){ return Math.ceil(chkDate.getDate()/7); }
function chkLabel(){
  if(chkPeriod==="daily")  return dLabel(dateKey(chkDate))+(dateKey(chkDate)===today()?" · 오늘":"");
  if(chkPeriod==="weekly"){
    const s=new Date(chkDate); s.setDate(s.getDate()-((s.getDay()+6)%7));
    const e=new Date(s); e.setDate(e.getDate()+6);
    return (s.getMonth()+1)+"/"+s.getDate()+" ~ "+(e.getMonth()+1)+"/"+e.getDate()+" 주간";
  }
  return monthLabel(monthKey(chkDate));
}
function moveChkDate(d){
  if(chkPeriod==="daily")  chkDate.setDate(chkDate.getDate()+d);
  else if(chkPeriod==="weekly") chkDate.setDate(chkDate.getDate()+7*d);
  else chkDate.setMonth(chkDate.getMonth()+d);
  render();
}
function viewCheck(){
  const groups = data.chkItems[chkArea][chkPeriod] || {};
  const map = data.checks[chkKey()] || {};
  let tot=0, done=0;
  for(const g in groups) groups[g].forEach(function(it){ tot++; if(map[g+"::"+it]) done++; });
  const pct = tot? Math.round(done/tot*100):0;

  let html = '<div class="seg">'
    + '<button class="'+(chkArea==="hall"?"on":"")+'" onclick="chkArea=\'hall\';render()">🏠 홀</button>'
    + '<button class="'+(chkArea==="kitchen"?"on":"")+'" onclick="chkArea=\'kitchen\';render()">🍳 주방</button></div>';
  html += '<div class="chips">'
    + [["daily","일일"],["weekly","주간"],["monthly","월간"]].map(function(p){
        return '<button class="chip '+(chkPeriod===p[0]?"on":"")+'" onclick="chkPeriod=\''+p[0]+'\';render()">'+p[1]+'</button>'; }).join("")
    + '</div>';
  html += '<div class="card tight"><div class="row" style="margin-bottom:9px">'
    + '<button class="btn g sm" onclick="moveChkDate(-1)">‹</button>'
    + '<div class="sp" style="text-align:center;font-weight:800">'+chkLabel()+'</div>'
    + '<button class="btn g sm" onclick="moveChkDate(1)">›</button></div>'
    + '<div class="row" style="gap:8px"><div class="sp pbar"><i style="width:'+pct+'%"></i></div>'
    + '<span class="muted" style="font-weight:700">'+done+'/'+tot+'</span></div></div>';

  const wk = weekOfMonth();
  for(const g in groups){
    const isThisWeek = chkPeriod==="monthly" && g===(wk+"주차");
    html += '<div class="card"><div class="row" style="margin-bottom:4px">'
      + '<div class="sec-t sp" style="margin:0">'+esc(g)+(isThisWeek?' <span class="bdg br">이번주</span>':'')+'</div>'
      + (isMgr()?'<button class="btn xs g" onclick="editChkGroup(\''+jsq(g)+'\')">✏️ 그룹</button>'
               + '<button class="btn xs g" onclick="addChkItem(\''+jsq(g)+'\')">+ 항목</button>':'')+'</div>';
    groups[g].forEach(function(it,idx){
      const k=g+"::"+it, c=map[k];
      html += '<div class="chk '+(c?"done":"")+'" onclick="toggleChk(\''+jsq(g)+'\','+idx+')">'
        + '<div class="box '+(c?"on":"")+'">'+(c?"✓":"")+'</div>'
        + '<div class="sp"><div class="ctxt">'+esc(it)+'</div>'
        + (c?'<div class="li-s">'+esc(c.t)+(c.by?' · '+esc(c.by):'')+'</div>':'')+'</div>'
        + (isMgr()?'<button class="btn xs g" onclick="event.stopPropagation();editChkItem(\''+jsq(g)+'\','+idx+')">✏️</button>':'')
        + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="grid2">'
    + (isMgr()?'<button class="btn g sm" onclick="addChkGroup()">+ 그룹 추가</button>':'<span></span>')
    + '<button class="btn g sm" onclick="copyChk()">📋 결과 복사</button></div>';
  return html;
}
function toggleChk(g,idx){
  const it = data.chkItems[chkArea][chkPeriod][g][idx];
  const key = chkKey(), k = g+"::"+it;
  if(!data.checks[key]) data.checks[key]={};
  if(data.checks[key][k]) delete data.checks[key][k];
  else data.checks[key][k] = { d:today(), t:nowHM(), by:meName() };
  save(); render();
}
function addChkItem(g){
  const v = prompt("["+g+"]에 추가할 항목을 입력하세요");
  if(!v || !v.trim()) return;
  data.chkItems[chkArea][chkPeriod][g].push(v.trim());
  save(); render();
}
function delChkItem(g,idx){
  if(!confirm("이 항목을 삭제할까요?")) return;
  const it = data.chkItems[chkArea][chkPeriod][g][idx];
  data.chkItems[chkArea][chkPeriod][g].splice(idx,1);
  moveCheckKey(g+"::"+it, null);          /* 체크 기록도 같이 정리 */
  save(); closeSheet(); render(); toast("삭제했어요");
}

/* 체크 기록의 키를 옮기거나(이름 변경) 지운다 */
function moveCheckKey(oldK, newK){
  const pre = chkArea+"|"+chkPeriod+"|";
  for(const mapKey in data.checks){
    if(mapKey.indexOf(pre)!==0) continue;
    const m = data.checks[mapKey];
    if(m && m[oldK]!==undefined){
      if(newK) m[newK] = m[oldK];
      delete m[oldK];
    }
  }
}
/* 항목 수정 · 순서 이동 · 삭제 */
function editChkItem(g, idx){
  const arr = data.chkItems[chkArea][chkPeriod][g];
  const it = arr[idx]; if(it===undefined) return;
  const b = '<div class="card tight"><div class="muted">'+esc(g)+' · '+(idx+1)+'번째 항목</div></div>'
    + '<div class="f"><label>항목 내용</label><textarea id="ciTxt" style="min-height:70px">'+esc(it)+'</textarea></div>'
    + '<div class="grid2" style="margin-bottom:10px">'
    + '<button class="btn g sm" '+(idx===0?'style="opacity:.4"':'')+' onclick="moveChkItem(\''+jsq(g)+'\','+idx+',-1)">↑ 위로</button>'
    + '<button class="btn g sm" '+(idx===arr.length-1?'style="opacity:.4"':'')+' onclick="moveChkItem(\''+jsq(g)+'\','+idx+',1)">↓ 아래로</button></div>'
    + '<button class="btn full" onclick="saveChkItem(\''+jsq(g)+'\','+idx+')">저장</button>'
    + '<button class="btn g full" style="margin-top:8px;color:var(--bad)" onclick="delChkItem(\''+jsq(g)+'\','+idx+')">삭제</button>'
    + '<div class="muted" style="margin-top:10px">💡 이름을 바꿔도 지금까지 체크한 기록은 그대로 따라갑니다.</div>';
  sheet("항목 수정", b);
}
function saveChkItem(g, idx){
  const arr = data.chkItems[chkArea][chkPeriod][g];
  const old = arr[idx];
  const v = (document.getElementById("ciTxt")||{}).value || "";
  const t = v.trim();
  if(!t){ toast("내용을 입력하세요"); return; }
  if(t === old){ closeSheet(); return; }
  if(arr.indexOf(t) >= 0){ toast("같은 항목이 이미 있어요"); return; }
  arr[idx] = t;
  moveCheckKey(g+"::"+old, g+"::"+t);
  save(); closeSheet(); render(); toast("수정했어요 ✓");
}
function moveChkItem(g, idx, d){
  const arr = data.chkItems[chkArea][chkPeriod][g];
  const j = idx + d;
  if(j<0 || j>=arr.length) return;
  const t = arr[idx]; arr[idx]=arr[j]; arr[j]=t;
  save(); render(); editChkItem(g, j);
}
/* 그룹 이름 변경 · 그룹 삭제 */
function editChkGroup(g){
  const cnt = (data.chkItems[chkArea][chkPeriod][g]||[]).length;
  const b = '<div class="f"><label>그룹 이름</label><input id="cgTxt" value="'+esc(g)+'"></div>'
    + '<div class="muted" style="margin-bottom:12px">항목 '+cnt+'개가 이 그룹에 들어 있어요</div>'
    + '<button class="btn full" onclick="saveChkGroup(\''+jsq(g)+'\')">저장</button>'
    + '<button class="btn g full" style="margin-top:8px;color:var(--bad)" onclick="delChkGroup(\''+jsq(g)+'\')">그룹 통째로 삭제</button>';
  sheet("그룹 수정", b);
}
function saveChkGroup(g){
  const groups = data.chkItems[chkArea][chkPeriod];
  const v = (document.getElementById("cgTxt")||{}).value || "";
  const t = v.trim();
  if(!t){ toast("이름을 입력하세요"); return; }
  if(t===g){ closeSheet(); return; }
  if(groups[t]){ toast("같은 이름의 그룹이 있어요"); return; }
  const items = groups[g];
  delete groups[g];
  groups[t] = items;
  items.forEach(function(it){ moveCheckKey(g+"::"+it, t+"::"+it); });
  save(); closeSheet(); render(); toast("그룹 이름을 바꿨어요 ✓");
}
function delChkGroup(g){
  const items = data.chkItems[chkArea][chkPeriod][g]||[];
  if(!confirm("["+g+"] 그룹과 항목 "+items.length+"개를 모두 삭제할까요?")) return;
  items.forEach(function(it){ moveCheckKey(g+"::"+it, null); });
  delete data.chkItems[chkArea][chkPeriod][g];
  save(); closeSheet(); render(); toast("그룹을 삭제했어요");
}
function addChkGroup(){
  const v = prompt("새 그룹 이름 (예: 배달 준비)");
  if(!v || !v.trim()) return;
  if(!data.chkItems[chkArea][chkPeriod][v.trim()]) data.chkItems[chkArea][chkPeriod][v.trim()]=[];
  save(); render();
}
function copyChk(){
  const groups=data.chkItems[chkArea][chkPeriod]||{}, map=data.checks[chkKey()]||{};
  let t = "✅ "+(data.settings.store||"")+" "+(chkArea==="hall"?"홀":"주방")+" "
        + ({daily:"일일",weekly:"주간",monthly:"월간"}[chkPeriod])+" 체크\n"+chkLabel()+"\n─────────────────\n";
  for(const g in groups){
    t += "["+g+"]\n";
    groups[g].forEach(function(it){
      const c=map[g+"::"+it];
      t += (c?"✔ ":"☐ ")+it+(c&&c.by?" ("+c.by+" "+c.t+")":"")+"\n";
    });
    t += "\n";
  }
  copyTxt(t.trim());
}

/* ═══════════════ 시트 · 내 정보 · 설정 ═══════════════ */
function sheet(title, html){
  document.getElementById("shTitle").textContent = title;
  document.getElementById("shBody").innerHTML = html;
  markKorean(document.getElementById("shBody"));
  document.getElementById("mask").classList.add("on");
  document.querySelector(".sheet").scrollTop = 0;
}
/* 글자 입력칸은 한글 우선으로 (숫자·시간·날짜 칸은 제외) */
function markKorean(root){
  if(!root) return;
  const els = root.querySelectorAll("input:not([type]), input[type=text], textarea");
  for(let i=0;i<els.length;i++){
    els[i].setAttribute("lang","ko");
    els[i].setAttribute("inputmode","text");
    els[i].setAttribute("autocapitalize","off");
    els[i].setAttribute("autocorrect","off");
    els[i].setAttribute("spellcheck","false");
  }
}
function closeSheet(){ document.getElementById("mask").classList.remove("on"); }

function openMe(){
  const me = staffById(meId);
  let b = '<div class="card"><div class="sec-t">👤 로그인 정보</div>'
    + '<div class="li"><div class="sp"><div class="li-t">'+esc(me? me.name : "관리자 (핀 로그인)")
    + ' <span class="bdg '+(myLvl>=2?"br":myLvl>=1?"blue":"")+'">'+myLvlName()+'</span></div>'
    + '<div class="li-s">'+ROLES[["hall","kitchen","manager","admin"][myLvl]].d+'</div></div></div>'
    + '<div class="grid2" style="margin-top:11px">'
    + (me? '<button class="btn g sm" onclick="changePwSheet()">🔒 비밀번호 변경</button>':'<span></span>')
    + '<button class="btn sm bad" onclick="logout()">로그아웃</button></div></div>';

  b += '<div class="card"><div class="sec-t">📋 권한별로 되는 일</div>'
    + ["hall","kitchen","manager","admin"].map(function(r){
        return '<div class="li"><div class="sp"><div class="li-t">'+ROLES[r].n+'</div>'
          + '<div class="li-s">'+ROLES[r].d+'</div></div>'
          + (myLvl===ROLES[r].lv?'<span class="bdg ok">지금</span>':'')+'</div>';
      }).join("")+'</div>';

  sheet("내 계정", b);
}
function changePwSheet(){
  const me = staffById(meId); if(!me) return;
  const b = '<div class="card"><div class="f"><label>지금 비밀번호</label><input type="password" id="cpOld" inputmode="numeric"></div>'
    + '<div class="f"><label>새 비밀번호 (4자 이상)</label><input type="password" id="cpN1" inputmode="numeric"></div>'
    + '<div class="f"><label>새 비밀번호 한 번 더</label><input type="password" id="cpN2" inputmode="numeric"></div>'
    + '<button class="btn full" onclick="changePw()">변경</button></div>';
  sheet("비밀번호 변경", b);
}
function changePw(){
  const me = staffById(meId); if(!me) return;
  const o=(document.getElementById("cpOld")||{}).value||"";
  const n1=(document.getElementById("cpN1")||{}).value||"", n2=(document.getElementById("cpN2")||{}).value||"";
  if(!checkPw(me,o)){ toast("지금 비밀번호가 달라요 ✕"); return; }
  if(n1.length<4){ toast("4자 이상으로 만들어 주세요"); return; }
  if(n1!==n2){ toast("새 비밀번호가 서로 달라요"); return; }
  me.pwh = pwHash(me.id, n1); save();
  closeSheet(); render(); toast("비밀번호를 바꿨어요 ✓");
}
/* 이름 선택 없이 권한만 올릴 때 (사장님 PC 등) */
function raiseLvl(){
  const v = prompt("관리자 핀번호를 입력하세요\n(매니저 권한은 본인 이름을 선택하면 자동으로 적용돼요)");
  if(v===null) return;
  if(String(v).trim() !== String(data.settings.adminPin||"1234")){ toast("핀번호가 틀려요 ✕"); return; }
  setLvl(3); closeSheet(); render(); toast("관리자 권한 ✓");
}
function openSettings(){
  const S=data.settings;
  let b='<div class="card"><div class="sec-t">🏪 가게</div>'
    + '<div class="f"><label>가게 이름</label><input id="stName" value="'+esc(S.store)+'"></div>'
    + '<div class="f"><label>급여 지급일 (매월)</label><input type="number" id="stPay" value="'+num(S.payday,10)+'"></div></div>';
  if(isAdmin()){
    b += '<div class="card"><div class="sec-t">💰 수당 규칙</div>'
      + tog("stNight","야간수당 (22~06시 0.5배 가산)",S.nightPay)
      + tog("stWeek","주휴수당 자동계산 (주 15시간 이상)",S.weeklyPay)
      + tog("stOT","연장수당 (1일 8시간 초과 0.5배)",S.otPay)

          + '<button class="btn xs g" onclick="copyTxt(TEAM_ID)">복사</button></div>'
          + (isAdmin()&&inviteLink()? '<button class="btn full sm" style="margin-top:10px" onclick="copyTxt(inviteLink())">🔗 직원 초대 링크 복사</button>'
              + '<div class="muted" style="margin-top:6px">이 링크로 열면 코드 입력 없이 바로 연결돼요 (카톡으로 전달)</div>':'')
          + (isAdmin()? '<button class="btn g full sm" style="margin-top:10px" onclick="openTeamGate()">팀 코드 변경 / 다시 연결</button>' : '')
          + '<div class="muted" style="margin-top:8px">⚠️ 코드를 아는 사람은 급여까지 볼 수 있어요. 직원에게만 알려주세요.</div>'

    + '<div style="font-size:34px">🍢</div>'
    + '<div style="font-size:19px;font-weight:800;margin-top:6px">'+esc(data.settings.store||"가게관리")+'</div>'
    + '<div class="muted" style="margin-top:4px">이름을 누르고 비밀번호를 입력하세요</div></div>';

    h += '<div class="card" style="border-color:#f6d9a8;background:var(--warn-soft)">'

      h += '<div class="card"><div class="empty">가게 자료를 불러오는 중…<br>'
        + '<span class="muted">잠시 후에도 안 뜨면 새로고침해 주세요</span></div></div>';

    }

      + '<div class="li-s">'+(hasPw(s)? "비밀번호로 로그인" : "🔓 비밀번호 미설정 — 처음 로그인")+'</div></div>'

function loginSheet(id){
  const s = staffById(id); if(!s) return;
  const first = !hasPw(s);
  const r = roleOf(s), lv = roleLv(r);
  let b = '<div class="card tight"><div class="row"><div class="sp">'
    + '<div class="li-t">'+esc(s.name)+' <span class="bdg '+(lv>=2?"br":lv>=1?"blue":"")+'">'+roleName(r)+'</span></div>'
    + '<div class="li-s">'+ROLES[r].d+'</div></div></div></div>';
  if(first){
    b += '<div class="card"><div class="sec-t">🔓 처음 로그인 — 비밀번호 만들기</div>'
      + (lv>=2? '<div class="f"><label>관리자 핀 (매니저·관리자 계정 확인용)</label>'
              + '<input type="password" id="lgAdmin" inputmode="numeric" placeholder="사장님께 받은 핀"></div>' : '')
      + '<div class="f"><label>새 비밀번호 (4자 이상)</label><input type="password" id="lgP1" inputmode="numeric"></div>'
      + '<div class="f"><label>한 번 더</label><input type="password" id="lgP2" inputmode="numeric"></div>'
      + '<button class="btn full" onclick="createPw(\''+id+'\')">비밀번호 만들고 로그인</button>'
      + '<div class="muted" style="margin-top:9px">이 비밀번호로 매번 로그인해요. 잊으면 사장님이 초기화해 줍니다.</div></div>';
  } else {
    b += '<div class="card"><div class="f"><label>비밀번호</label>'
      + '<input type="password" id="lgP" class="pin" inputmode="numeric" autocomplete="current-password"></div>'
      + '<button class="btn full" onclick="doLogin(\''+id+'\')">로그인</button></div>';
  }
  sheet("로그인", b);
  setTimeout(function(){ const e=document.getElementById("lgP")||document.getElementById("lgAdmin")||document.getElementById("lgP1"); if(e) e.focus(); },200);
}
function doLogin(id){
  const s = staffById(id); if(!s) return;
  const pw = (document.getElementById("lgP")||{}).value || "";
  if(!checkPw(s, pw)){ toast("비밀번호가 달라요 ✕"); return; }
  loginDone(id, roleLv(roleOf(s)));
  closeSheet(); render(); toast(s.name+" 님 환영합니다 ("+roleName(roleOf(s))+")");
}
function createPw(id){
  const s = staffById(id); if(!s) return;
  const lv = roleLv(roleOf(s));
  if(lv>=2){
    const ap = (document.getElementById("lgAdmin")||{}).value || "";
    if(String(ap).trim() !== String(data.settings.adminPin||"1234")){ toast("관리자 핀이 달라요 ✕"); return; }
  }
  const p1=(document.getElementById("lgP1")||{}).value||"", p2=(document.getElementById("lgP2")||{}).value||"";
  if(p1.length<4){ toast("4자 이상으로 만들어 주세요"); return; }
  if(p1!==p2){ toast("두 번 입력한 값이 달라요"); return; }
  s.pwh = pwHash(s.id, p1);
  save();
  loginDone(id, lv);
  closeSheet(); render(); toast("비밀번호를 만들었어요 ✓");
}
function loginByAdminPin(){
  const v = prompt("관리자 핀번호를 입력하세요");
  if(v===null) return;
  if(String(v).trim() !== String(data.settings.adminPin||"1234")){ toast("핀번호가 틀려요 ✕"); return; }
  loginDone("", 3);
  render(); toast("관리자로 들어왔어요");
}
function firstAdmin(){
  const n = prompt("사장님 이름을 입력하세요");
  if(n===null || !n.trim()) return;
  const p = prompt("사용할 비밀번호를 입력하세요 (4자 이상)");
  if(p===null) return;
  if(String(p).length<4){ toast("4자 이상으로 만들어 주세요"); return; }
  const s = { id:uid(), name:n.trim(), role:"admin", active:true,
              payType:"monthly", monthly:0, deduct:"none" };
  s.pwh = pwHash(s.id, p);
  data.staff.push(s); save();
  loginDone(s.id, 3);
  render(); toast("사장님 계정을 만들었어요 ✓");
}
function resetPw(id){
  const s = staffById(id); if(!s) return;
  if(!isAdmin()){ toast("사장님만 초기화할 수 있어요"); return; }
  if(!confirm(s.name+" 님의 비밀번호를 지울까요?\n다음 로그인 때 본인이 새로 만듭니다.")) return;
  delete s.pwh; save(); closeSheet(); render(); toast("초기화했어요");
}

  if(TEAM_ID){
    if(!confirm("⚠️ 이미 '"+TEAM_ID+"' 팀에 연결돼 있어요.\n\n새로 만들면 지금 자료와 분리된 '빈 가게'가 생기고,\n기기마다 다른 자료를 보게 됩니다.\n\n정말 새로 만들까요?")) return;
    if(!confirm("한 번 더 확인할게요.\n\n대부분의 경우 필요 없는 작업입니다.\n기존 팀으로 돌아가려면 초대 링크를 다시 열면 돼요.\n\n계속할까요?")) return;
  }
  if(!confirm("새 팀 코드를 만들까요?\n\n"+c+"\n\n이 기기가 사장님(관리자) 기기가 되고,\n직원 폰은 초대 링크로 연결하면 직원 모드로 열립니다.")) return;

    myRole="admin"; lsSet("sm-role","admin");      /* 팀을 만든 기기 = 관리자 */

function joinTeam(){

  let msg = "이 기기를 팀에 연결할까요?";

function tog(id,label,on){

    + '<select id="'+id+'" style="width:88px"><option value="1" '+(on?"selected":"")+'>사용</option>'

function saveSettings(){
  const S=data.settings;
  S.store=document.getElementById("stName").value.trim()||"가게관리";
  S.payday=num(document.getElementById("stPay").value,10);
  const n=document.getElementById("stNight");
  if(n){
    S.nightPay = n.value==="1";
    S.weeklyPay = document.getElementById("stWeek").value==="1";
    S.otPay = document.getElementById("stOT").value==="1";

/* 서비스워커·캐시를 비우고 최신 파일로 다시 받기 */
function hardReload(){
  const go2 = function(){
    const base = location.origin + location.pathname;
    location.replace(base + "?v=" + Date.now() + (TEAM_ID? "&t="+TEAM_ID : ""));
  };
  try{
    const jobs=[];
    if(window.caches && caches.keys) jobs.push(caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
    Promise.all(jobs).then(go2, go2);
    setTimeout(go2, 1500);
  }catch(e){ go2(); }
}
function backup(){
  const blob = new Blob([JSON.stringify(data,null,1)], {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(data.settings.store||"가게")+"_백업_"+today()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast("백업 파일을 저장했어요");
}
function restore(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=function(){
      try{
        const d=JSON.parse(rd.result);
        if(!confirm("현재 데이터를 백업 파일 내용으로 덮어쓸까요?")) return;
        FIELDS.forEach(function(k){ if(d[k]!==undefined && d[k]!==null) data[k]=d[k]; });
        save(); closeSheet(); render(); toast("복원했어요 ✓");
      }catch(e){ toast("파일을 읽을 수 없어요"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm("모든 데이터(직원·근무기록·레시피·자재·체크)를 지웁니다. 계속할까요?")) return;
  if(!confirm("정말 초기화할까요? 되돌릴 수 없어요.")) return;
  const fresh = JSON.parse(JSON.stringify(BLANK));
  fresh.chkItems = JSON.parse(JSON.stringify(DEFAULT_CHK));
  FIELDS.forEach(function(k){ data[k]=fresh[k]; });
  save(); closeSheet(); render(); toast("초기화했어요");
}
