<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가게관리">
<meta name="mobile-web-app-capable" content="yes">
<title>가게관리 통합앱</title>
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --ink:#1c1917; --sub:#78716c; --line:#e7e5e4;
  --brand:#c2410c; --brand-soft:#fff1e7; --brand-ink:#9a3412;
  --ok:#15803d; --ok-soft:#eafaf0; --warn:#b45309; --warn-soft:#fef6e7;
  --bad:#b91c1c; --bad-soft:#fdeceb; --blue:#1d4ed8; --blue-soft:#eef2ff;
  --r:14px; --sh:0 1px 3px rgba(28,25,23,.07), 0 1px 2px rgba(28,25,23,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fff;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:70px}

header{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.hd-row{display:flex;align-items:center;gap:8px}
.hd-title{font-size:17px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-btn{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;
  font-size:12.5px;font-weight:700;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;opacity:.92}
.dot{width:7px;height:7px;border-radius:50%;background:#86efac;flex:none}
.dot.bad{background:#fca5a5}

.wrap{padding:14px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
.sec-t{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.4px;
  margin:2px 0 9px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.sp{flex:1;min-width:0}
.muted{color:var(--sub);font-size:12.5px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px}

.btn{background:var(--brand);color:#fff;border-radius:11px;padding:11px 15px;
  font-weight:700;font-size:14.5px;text-align:center;display:inline-block}
.btn.g{background:#f5f5f4;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.blue{background:var(--blue)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.full{display:block;width:100%}
.btn:active{filter:brightness(.93)}
.btn.off{opacity:.45}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--sub)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.chip.add{border-style:dashed;color:var(--brand);border-color:var(--brand)}
.seg{display:flex;background:#eeecea;border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}

.bdg{display:inline-block;padding:2.5px 8px;border-radius:999px;font-size:11px;font-weight:800;
  background:#f5f5f4;color:var(--sub);white-space:nowrap}
.bdg.ok{background:var(--ok-soft);color:var(--ok)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}
.bdg.br{background:var(--brand-soft);color:var(--brand-ink)}
.bdg.blue{background:var(--blue-soft);color:var(--blue)}

.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li-t{font-weight:700;font-size:14.5px}
.li-s{font-size:12.5px;color:var(--sub);margin-top:2px}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:26px 10px;line-height:1.7}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center}
.tile b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}
.tile span{font-size:11.5px;color:var(--sub);font-weight:600}

.chk{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:none}
.box{width:23px;height:23px;border-radius:7px;border:2px solid #d6d3d1;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900}
.box.on{background:var(--ok);border-color:var(--ok)}
.chk.done .ctxt{color:#a8a29e;text-decoration:line-through}
.ctxt{font-size:14.5px;line-height:1.45}

.pbar{height:7px;background:#eeecea;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;
  font-size:10.5px;font-weight:700;color:#a8a29e}
nav button i{font-style:normal;font-size:21px;line-height:1}
nav button.on{color:var(--brand)}

.mask{position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:100;display:none;
  align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0}
.sheet-hd{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;z-index:2;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-hd b{flex:1;font-size:16.5px;font-weight:800}
.sheet-bd{padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.x{width:30px;height:30px;border-radius:50%;background:#eeecea;color:var(--sub);font-size:17px;font-weight:700;flex:none}
@media(min-width:721px){ .mask{align-items:center} .sheet{border-radius:20px;max-height:88vh} }

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:200;
  background:#1c1917;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
.toast.on{opacity:.96}
.kv{display:flex;justify-content:space-between;padding:6.5px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:700}
.kv.big{font-size:16.5px;padding:11px 0;border-bottom:none}
.kv.big b{color:var(--brand);font-weight:800}
.step{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.divh{height:1px;background:var(--line);margin:12px 0}
.pin{letter-spacing:8px;text-align:center;font-size:22px;font-weight:800;padding:12px}
.big-punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-punch button{padding:20px 8px;border-radius:14px;font-size:17px;font-weight:800;color:#fff}
.punch-in{background:var(--ok)} .punch-out{background:var(--bad)}

/* ── 인쇄 ── */
#printArea{display:none}
@media print{
  @page{ size:A4; margin:12mm 11mm; }
  header,nav,.wrap,.mask,.toast{display:none !important}
  html,body{background:#fff !important;padding:0 !important;margin:0 !important}
  #printArea{display:block;color:#000}
  .p-sheet{page-break-after:always;break-after:page}
  .p-sheet:last-child{page-break-after:auto;break-after:auto}
  .p-ings,.p-step,.p-tip{page-break-inside:avoid;break-inside:avoid}
}
.p-sheet{font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;line-height:1.45}
.p-store{font-size:11pt;color:#444;letter-spacing:1px}
.p-h1{font-size:30pt;font-weight:800;margin:2mm 0 1mm;letter-spacing:-1px}
.p-sub{font-size:12pt;color:#333;margin-bottom:4mm}
.p-rule{border:none;border-top:3px solid #000;margin:3mm 0 5mm}
.p-h2{font-size:14pt;font-weight:800;margin:0 0 2.5mm;padding-bottom:1.5mm;border-bottom:1.5px solid #000}
.p-ings{width:100%;border-collapse:collapse;margin-bottom:7mm}
.p-ings td{border-bottom:1px solid #bbb;padding:2.6mm 1mm;font-size:13pt;vertical-align:top}
.p-ings td.q{text-align:right;font-weight:800;white-space:nowrap;width:32%}
.p-step{display:flex;gap:4mm;margin-bottom:3.6mm;font-size:13.5pt}
.p-step b{flex:none;width:8mm;height:8mm;border-radius:50%;background:#000;color:#fff;
  font-size:10.5pt;display:flex;align-items:center;justify-content:center;margin-top:.6mm}
.p-tip{border:1.5px solid #000;border-radius:2mm;padding:3.5mm 4mm;font-size:12pt;margin-top:5mm}
.p-foot{margin-top:7mm;padding-top:2.5mm;border-top:1px solid #999;font-size:9.5pt;color:#555;
  display:flex;justify-content:space-between}
#printArea.big .p-h1{font-size:38pt}
#printArea.big .p-ings td{font-size:17pt;padding:3.4mm 1mm}
#printArea.big .p-step{font-size:17pt;margin-bottom:5mm}
#printArea.big .p-step b{width:10mm;height:10mm;font-size:12pt}
#printArea.big .p-h2{font-size:17pt}
#printArea.big .p-tip{font-size:15pt}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <div class="hd-title" id="hdTitle">🍢 가게관리</div>
    <button class="hd-btn" id="meBtn" onclick="openMe()">👤 나</button>
    <button class="hd-btn" id="setBtn" onclick="openSettings()">⚙️</button>
  </div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">연결 중…</span></div>
</header>

<div class="wrap" id="view"></div>

<nav id="nav">
  <button data-tab="home"   onclick="go('home')"><i>🏠</i>홈</button>
  <button data-tab="recipe" onclick="go('recipe')"><i>📖</i>레시피</button>
  <button data-tab="work"   onclick="go('work')"><i>⏱️</i>근태·급여</button>
  <button data-tab="stock"  onclick="go('stock')"><i>📦</i>자재</button>
  <button data-tab="check"  onclick="go('check')"><i>✅</i>체크</button>
</nav>

<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-hd"><b id="shTitle"></b><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sheet-bd" id="shBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* ═══ 기본 체크리스트 항목 ═══ */

function dLabel(k){ const p=k.split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hm2min(t){ if(!t||t.indexOf(":")<0) return null; const p=t.split(":");
  return (+p[0])*60 + (+p[1]); }
function min2hm(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function durTxt(min){ const h=Math.floor(min/60), m=Math.round(min%60);

function weekKeyOf(k){
  const p=k.split("-"); const t=new Date(+p[0],+p[1]-1,+p[2]);
  const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day+3);
  const ft=new Date(t.getFullYear(),0,4); const fd=(ft.getDay()+6)%7;
  ft.setDate(ft.getDate()-fd+3);
  const wk=1+Math.round((t-ft)/(7*24*3600*1000));
  return t.getFullYear()+"-W"+pad(wk);
}

function pwHash(id, pw){
  const s = "sm:"+String(id)+":"+String(pw);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i=0;i<s.length;i++){
    const c = s.charCodeAt(i);
    h1 = ((h1 ^ c) >>> 0); h1 = (Math.imul(h1, 16777619) >>> 0);
    h2 = ((h2 + c*(i+7)) >>> 0); h2 = (Math.imul(h2, 2246822519) >>> 0);
  }
  return h1.toString(36)+"-"+h2.toString(36);
}
function hasPw(s){ return !!(s && s.pwh); }
function checkPw(s, pw){ return !!(s && s.pwh && s.pwh === pwHash(s.id, pw)); }

function applyRemote(d){
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")){
    pendingRemote=d;
    setTimeout(function(){ if(pendingRemote){ const p=pendingRemote; pendingRemote=null; applyRemote(p); } },2500);

  /* 서버가 비어 있는데 이 기기에 자료가 있으면 → 지우지 말고 올린다 */
  if(!hasContent(inc) && hasContent(data)){
    applyingRemote=false;
    pushRemote();
    setSync("ok","이 기기 자료를 팀에 올렸어요 ⬆️");

<script>
/* ═══════════════ 급여 계산 엔진 ═══════════════ */
const NIGHT_S = 22*60, NIGHT_E = 30*60;   // 22:00 ~ 익일 06:00

/* 한 기록의 총 근무분 / 야간분 / 연장분 */
function recCalc(r){
  const i = hm2min(r.in), o = hm2min(r.out);
  if(i===null || o===null) return { total:0, night:0, ot:0, span:0 };
  let end = o; if(end <= i) end += 1440;
  const span = end - i;
  let total = span - num(r.brk);
  if(total < 0) total = 0;
  let night = 0;
  for(let k=-1;k<=2;k++){
    const s = NIGHT_S + 1440*k, e = NIGHT_E + 1440*k;
    night += Math.max(0, Math.min(end,e) - Math.max(i,s));
  }
  if(night > total) night = total;
  const ot = Math.max(0, total - 8*60);
  return { total:total, night:night, ot:ot, span:span };
}
function recMin(r){ return recCalc(r).total; }

function adjKey(m,sid){ return m+"|"+sid; }
function getAdj(m,sid){
  const a = data.payAdj[adjKey(m,sid)];
  return a ? a : { bonus:0, bonusMemo:"", cut:0, cutMemo:"", paid:false };
}
function setAdj(m,sid,patch){
  const cur = getAdj(m,sid);
  for(const k in patch) cur[k]=patch[k];
  data.payAdj[adjKey(m,sid)] = cur; save();
}

/* 한 직원의 월 급여 계산 */
function payroll(staff, m){
  const recs = data.attend.filter(function(r){
    return r.staffId===staff.id && r.date && r.date.slice(0,7)===m && r.out;
  });
  let total=0, night=0, ot=0, days={};
  recs.forEach(function(r){
    const c = recCalc(r);
    total += c.total; night += c.night; ot += c.ot; days[r.date]=1;
  });
  const wage = num(staff.wage);
  const S = data.settings;
  const R = { recs:recs.length, days:Object.keys(days).length,
              totalMin:total, nightMin:night, otMin:ot,
              base:0, nightPay:0, otPay:0, weekPay:0, weekHours:0,
              gross:0, ded:[], dedSum:0, net:0, type:staff.payType||"hourly" };

  if(R.type === "monthly"){
    R.base = num(staff.monthly);
  } else {
    R.base = (total/60) * wage;
    if(S.nightPay && staff.nightPay!==false) R.nightPay = (night/60) * wage * 0.5;
    if(S.otPay) R.otPay = (ot/60) * wage * 0.5;
    if(S.weeklyPay && staff.weeklyPay!==false){
      const wk = {};
      recs.forEach(function(r){
        const k = weekKeyOf(r.date);
        wk[k] = (wk[k]||0) + recCalc(r).total;
      });
      for(const k in wk){
        const h = wk[k]/60;
        if(h >= 15){
          const wh = Math.min(h/40*8, 8);
          R.weekHours += wh; R.weekPay += wh * wage;
        }
      }
    }
  }
  const adj = getAdj(m, staff.id);
  R.bonus = num(adj.bonus); R.cut = num(adj.cut); R.paid = !!adj.paid;
  R.gross = R.base + R.nightPay + R.otPay + R.weekPay + R.bonus;

  const mode = staff.deduct || "none";
  if(mode === "33"){
    R.ded.push({n:"사업소득세 3.3%", v: R.gross*0.033});
  } else if(mode === "four"){
    const health = R.gross*0.03545;
    R.ded.push({n:"국민연금 4.5%",  v: R.gross*0.045});
    R.ded.push({n:"건강보험 3.545%", v: health});
    R.ded.push({n:"장기요양 12.95%", v: health*0.1295});
    R.ded.push({n:"고용보험 0.9%",   v: R.gross*0.009});
  }
  if(R.cut > 0) R.ded.push({n: adj.cutMemo || "기타 공제", v: R.cut});
  R.ded.forEach(function(d){ R.dedSum += d.v; });
  R.net = R.gross - R.dedSum;
  return R;
}
function monthLabel(m){ const p=m.split("-"); return (+p[0])+"년 "+(+p[1])+"월"; }
function shiftMonth(m, d){
  const p=m.split("-"); const dt=new Date(+p[0], +p[1]-1+d, 1); return monthKey(dt);
}

/* ═══════════════ 출퇴근 로직 ═══════════════ */
function openRec(staffId){
  for(let i=data.attend.length-1;i>=0;i--){
    const r=data.attend[i];
    if(r.staffId===staffId && !r.out) return r;
  }
  return null;
}
/* 본인 것은 그냥, 남의 것은 매니저 이상만 */
function askPin(staff, cb){
  if(staff.id === meId || isMgr()){ cb(); return; }
  toast("본인 것만 찍을 수 있어요 (대신 찍기는 매니저 이상)");
}
function punchIn(staffId){
  const s = staffById(staffId); if(!s) return;
  if(openRec(staffId)){ toast("이미 출근 중이에요"); return; }
  askPin(s, function(){
    data.attend.push({ id:uid(), staffId:staffId, date:today(), in:nowHM(), out:"",
                       brk:0, memo:"", by:meName()||s.name });
    save(); render(); toast(s.name+" 출근 ✓ "+nowHM());
  });
}
function punchOut(staffId){
  const s = staffById(staffId); if(!s) return;
  const r = openRec(staffId);
  if(!r){ toast("출근 기록이 없어요"); return; }
  askPin(s, function(){
    r.out = nowHM();
    const c = recCalc(r);
    save(); render(); toast(s.name+" 퇴근 ✓ 오늘 "+durTxt(c.total));
  });
}

/* ═══════════════ 라우터 ═══════════════ */
function go(t){ tab=t; window.scrollTo(0,0); render(); }
function render(){
  const nav = document.getElementById("nav");
  const v0  = document.getElementById("view");
  document.getElementById("hdTitle").textContent = "🍢 "+(data.settings.store||"가게관리");

  /* 로그인 전에는 로그인 화면만 */
  if(!isLoggedIn()){
    nav.style.display = "none";
    document.getElementById("meBtn").style.display = "none";
    document.getElementById("setBtn").style.display = "none";
    v0.innerHTML = viewLogin();
    markKorean(v0); paintSync();
    return;
  }
  nav.style.display = "";
  document.getElementById("meBtn").style.display = "";
  document.getElementById("setBtn").style.display = "";

  syncMyLvl();                       /* 사장님이 역할을 바꾸면 바로 반영 */
  const nv = nav.querySelectorAll("button");
  if(tab==="recipe" && !canRecipe()) tab="home";
  for(let i=0;i<nv.length;i++){
    nv[i].classList.toggle("on", nv[i].dataset.tab===tab);
    if(nv[i].dataset.tab==="recipe") nv[i].style.display = canRecipe()? "" : "none";
  }
  document.getElementById("meBtn").textContent = "👤 "+(meName()||"이름설정");
  const v = document.getElementById("view");
  if(tab==="home")   v.innerHTML = viewHome();
  if(tab==="recipe") v.innerHTML = viewRecipe();
  if(tab==="work")   v.innerHTML = viewWork();
  if(tab==="stock")  v.innerHTML = viewStock();
  if(tab==="check")  v.innerHTML = viewCheck();
  markKorean(v);
  paintSync();
}

/* ═══ 인수인계 메모 ═══ */
function addNote(){
  const v = prompt("다음 근무자에게 남길 내용을 적으세요\n(예: 참이슬 2박스 남음, 3번 테이블 의자 흔들림)");
  if(v===null) return;
  const t=v.trim(); if(!t) return;
  data.notes.push({ id:uid(), text:t, by:meName()||"익명", date:today(), time:nowHM(), at:Date.now(), done:false });
  save(); render(); toast("메모를 남겼어요 ✓");
}
function doneNote(id){
  const n = data.notes.filter(function(x){ return x.id===id; })[0];
  if(!n) return;
  n.done = true; n.doneBy = meName(); n.doneAt = Date.now();
  data.notes = data.notes.filter(function(x){
    return !x.done || (Date.now() - (x.doneAt||0)) < 7*86400000;   /* 확인된 메모는 7일 뒤 정리 */
  });
  save(); render(); toast("확인 처리했어요");
}

/* ═══════════════ 홈 ═══════════════ */
function chkProgress(area, period, dkey){
  const groups = data.chkItems[area][period] || {};
  const map = data.checks[area+"|"+period+"|"+dkey] || {};
  let tot=0, done=0;
  for(const g in groups) groups[g].forEach(function(it){
    tot++; if(map[g+"::"+it]) done++;
  });
  return { tot:tot, done:done, pct: tot? Math.round(done/tot*100):0 };
}
function viewHome(){
  const t = today();
  const working = data.staff.filter(function(s){ return !!openRec(s.id); });
  const low = data.stock.filter(function(i){ return num(i.min)>0 && num(i.stock) <= num(i.min); });
  const hall = chkProgress("hall","daily",t), kit = chkProgress("kitchen","daily",t);
  const m = monthKey(new Date());
  let html = "";

  /* 관리자 핀이 기본값이면 경고 */
  if(isAdmin() && String(data.settings.adminPin||"1234")==="1234"){
    html += '<div class="card" style="border-color:#f5c6c2;background:var(--bad-soft)">'
         +  '<div class="row"><div class="sp"><div class="li-t">🔑 관리자 핀이 기본값(1234)이에요</div>'
         +  '<div class="li-s" style="margin-top:3px">직원이 1234를 넣으면 급여까지 볼 수 있어요. 지금 바꿔주세요.</div></div>'
         +  '<button class="btn sm bad" onclick="openSettings()">변경</button></div></div>';
  }

  /* 저장이 안 되는 브라우저 경고 */
  if(!LS_OK){
    html += '<div class="card" style="border-color:#f5c6c2;background:var(--bad-soft)">'
         +  '<div class="li-t">⚠️ 이 브라우저는 저장이 안 돼요</div>'
         +  '<div class="li-s" style="margin-top:4px">카카오톡 내부 브라우저나 시크릿 창으로 보고 계신 것 같아요. '
         +  '입력한 내용이 창을 닫으면 사라집니다.<br><b>우측 하단 메뉴 → 다른 브라우저(크롬)로 열기</b>를 눌러 주세요.</div></div>';
  }

  /* 내 출퇴근 */
  const me = staffById(meId);
  html += '<div class="card">';
  if(me){
    const r = openRec(me.id);
    const mine = data.attend.filter(function(x){ return x.staffId===me.id && x.date===t; });
    let todayMin = 0; mine.forEach(function(x){ if(x.out) todayMin += recMin(x); });
    html += '<div class="row" style="margin-bottom:11px"><div class="sp">'
         +  '<div style="font-size:16px;font-weight:800">'+esc(me.name)+' 님</div>'
         +  '<div class="muted">'+dLabel(t)+(r? ' · <b style="color:var(--ok)">'+esc(r.in)+' 출근중</b>':
             (todayMin? ' · 오늘 '+durTxt(todayMin)+' 근무':' · 아직 출근 전'))+'</div></div>'
         +  (r? '<span class="bdg ok">근무중</span>':'<span class="bdg">대기</span>')+'</div>';
    html += '<div class="big-punch">'
         +  '<button class="punch-in" '+(r?'style="opacity:.4"':'')+' onclick="punchIn(\''+me.id+'\')">🟢 출근</button>'
         +  '<button class="punch-out" '+(!r?'style="opacity:.4"':'')+' onclick="punchOut(\''+me.id+'\')">🔴 퇴근</button></div>';
  } else {
    html += '<div class="row"><div class="sp"><div class="li-t">먼저 내 이름을 설정하세요</div>'
         +  '<div class="li-s">출퇴근·체크리스트 기록에 이름이 남아요</div></div>'
         +  '<button class="btn sm" onclick="openMe()">설정</button></div>';
  }
  html += '</div>';

  /* 요약 타일 */
  html += '<div class="tiles" style="margin-bottom:12px">'
       +  '<div class="tile" onclick="go(\'work\')"><b>'+working.length+'</b><span>근무 중</span></div>'
       +  '<div class="tile" onclick="go(\'check\')"><b>'+Math.round((hall.pct+kit.pct)/2)+'%</b><span>오늘 체크</span></div>'
       +  '<div class="tile" onclick="go(\'stock\')"><b style="'+(low.length?'color:var(--bad)':'')+'">'+low.length+'</b><span>발주 필요</span></div>'
       +  (canRecipe()
            ? '<div class="tile" onclick="go(\'recipe\')"><b>'+data.recipes.length+'</b><span>레시피</span></div>'
            : '<div class="tile" onclick="go(\'work\')"><b>'+(me? payroll(me,m).days : 0)+'</b><span>이번달 근무일</span></div>')
       +  '</div>';

  /* 근무 중 */
  if(working.length){
    html += '<div class="card"><div class="sec-t">🟢 지금 근무 중</div>';
    working.forEach(function(s){
      const r = openRec(s.id);
      const el = Math.max(0, Math.floor((Date.now() - new Date(r.date+"T"+r.in+":00").getTime())/60000));
      html += '<div class="li"><div class="sp"><div class="li-t">'+esc(s.name)+'</div>'
           +  '<div class="li-s">'+esc(r.in)+' 출근 · '+durTxt(el)+' 경과</div></div>'
           +  '<button class="btn xs bad" onclick="punchOut(\''+s.id+'\')">퇴근</button></div>';
    });
    html += '</div>';
  }

  /* 인수인계 메모 */
  const openNotes = data.notes.filter(function(n){ return !n.done; })
                              .sort(function(a,b){ return (b.at||0)-(a.at||0); });
  html += '<div class="card"><div class="row" style="margin-bottom:6px">'
       +  '<div class="sec-t sp" style="margin:0">📌 인수인계 메모</div>'
       +  '<button class="btn xs" onclick="addNote()">+ 남기기</button></div>';
  if(!openNotes.length) html += '<div class="muted">남긴 메모가 없어요</div>';
  openNotes.slice(0,5).forEach(function(n){
    html += '<div class="li"><button class="box" onclick="doneNote(\''+n.id+'\')"></button>'
         +  '<div class="sp"><div class="ctxt">'+esc(n.text).replace(/\n/g,"<br>")+'</div>'
         +  '<div class="li-s">'+esc(n.by||"")+' · '+esc(n.date||"")+' '+esc(n.time||"")+'</div></div></div>';
  });
  if(openNotes.length>5) html += '<div class="muted" style="padding-top:6px">외 '+(openNotes.length-5)+'개</div>';
  html += '</div>';

  /* 유통기한 임박 */
  const soon = expSoon(7);
  if(soon.length){
    html += '<div class="card" style="border-color:#f6d9a8;background:var(--warn-soft)">'
         +  '<div class="sec-t">📅 유통기한 임박</div>';
    soon.slice(0,6).forEach(function(x){
      html += '<div class="li"><div class="sp"><div class="li-t">'+esc(x.item.name)+'</div>'
           +  '<div class="li-s">'+esc(x.item.exp)+' · 재고 '+num(x.item.stock)+esc(x.item.unit||"")+'</div></div>'
           +  '<span class="bdg '+(x.past?"bad":"warn")+'">'+expLabel(x.item.exp)+'</span></div>';
    });
    html += '</div>';
  }

  /* 오늘 매출 (관리자) */
  if(isMgr()){
    const ts = todaySales();
    html += '<div class="card"><div class="row">'
         +  '<div class="sp"><div class="sec-t" style="margin:0">💵 오늘 매출</div>'
         +  '<div style="font-size:19px;font-weight:800;margin-top:3px">'+(ts?won(ts):'<span class="muted" style="font-size:14px">아직 입력 전</span>')+'</div></div>'
         +  '<button class="btn sm" onclick="editSale(null)">'+(ts?'수정':'입력')+'</button></div></div>';
  }

  /* 오늘 체크리스트 */
  html += '<div class="card"><div class="sec-t">✅ 오늘 체크리스트</div>';
  [["hall","🏠 홀",hall],["kitchen","🍳 주방",kit]].forEach(function(x){
    html += '<div style="margin-bottom:10px" onclick="chkArea=\''+x[0]+'\';chkPeriod=\'daily\';go(\'check\')">'
         +  '<div class="row" style="margin-bottom:5px"><div class="sp li-t">'+x[1]+'</div>'
         +  '<span class="muted">'+x[2].done+' / '+x[2].tot+'</span></div>'
         +  '<div class="pbar"><i style="width:'+x[2].pct+'%"></i></div></div>';
  });
  html += '</div>';

  /* 발주 필요 */
  if(low.length){
    html += '<div class="card"><div class="sec-t">📦 발주가 필요해요</div>';
    low.slice(0,6).forEach(function(i){
      html += '<div class="li"><div class="sp"><div class="li-t">'+esc(i.name)+'</div>'
           +  '<div class="li-s">현재 '+num(i.stock)+esc(i.unit||"")+' · 최소 '+num(i.min)+esc(i.unit||"")+'</div></div>'
           +  '<span class="bdg bad">부족</span></div>';
    });
    if(low.length>6) html += '<div class="muted" style="padding-top:8px">외 '+(low.length-6)+'개</div>';
    html += '<button class="btn g full sm" style="margin-top:10px" onclick="orderSheet()">📋 발주서 복사</button></div>';
  }

  /* 이번달 요약 */
  if(isAdmin()){
    let sum=0, minsum=0;
    data.staff.forEach(function(s){ const p=payroll(s,m); sum+=p.net; minsum+=p.totalMin; });
    html += '<div class="card"><div class="sec-t">💰 이번달 ('+monthLabel(m)+')</div>'
         +  '<div class="kv"><span>총 근무시간</span><b>'+durTxt(minsum)+'</b></div>'
         +  '<div class="kv"><span>예상 인건비 (실지급 합계)</span><b>'+won(sum)+'</b></div>'
         +  '<button class="btn g full sm" style="margin-top:11px" onclick="workSub=\'pay\';payMonth=\''+m+'\';go(\'work\')">급여 자세히 보기</button></div>';
  } else if(me){
    const p = payroll(me, m);
    html += '<div class="card"><div class="sec-t">💰 이번달 내 급여 (예상)</div>'
         +  '<div class="kv"><span>근무</span><b>'+p.days+'일 · '+durTxt(p.totalMin)+'</b></div>'
         +  '<div class="kv big"><span>실지급 예상</span><b>'+won(p.net)+'</b></div>'
         +  '<div class="muted" style="margin-top:6px">※ 확정 금액은 사장님 정산 기준입니다</div></div>';
  }
  return html;
}
</script>
<script>
/* ═══════════════ 근태 · 급여 ═══════════════ */
function viewWork(){
  const subs = [["punch","⏱️ 근무"],["shift","📅 스케줄"]]
    .concat(isAdmin()? [["pay","💰 급여"],["pl","📊 손익"]] : [])
    .concat([["staff","👥 직원"]]);
  let html = '<div class="chips">'+subs.map(function(s){
      return '<button class="chip '+(workSub===s[0]?"on":"")+'" onclick="workSub=\''+s[0]+'\';render()">'+s[1]+'</button>';
    }).join("")+'</div>';
  if(workSub==="pay"   && isAdmin()) return html + viewPay();
  if(workSub==="pl"    && isAdmin()) return html + viewPL();
  if(workSub==="shift") return html + viewShift();
  if(workSub==="staff") return html + viewStaff();
  return html + viewPunch();
}

function viewPunch(){
  const dk = dateKey(workDate);
  let html = '<div class="card tight"><div class="row">'
    + '<button class="btn g sm" onclick="moveWorkDate(-1)">‹</button>'
    + '<div class="sp" style="text-align:center;font-weight:800">'+dLabel(dk)+(dk===today()?' · 오늘':'')+'</div>'
    + '<button class="btn g sm" onclick="moveWorkDate(1)">›</button></div></div>';

  if(!data.staff.length){
    return html + '<div class="card"><div class="empty">등록된 직원이 없어요.<br>👥 직원 탭에서 먼저 등록해 주세요.</div>'
      + '<button class="btn full" onclick="workSub=\'staff\';render()">직원 등록하러 가기</button></div>';
  }

  /* 직원별 카드 */
  html += '<div class="card"><div class="sec-t">🟢 출퇴근 찍기</div>';
  data.staff.filter(function(s){ return s.active!==false; }).forEach(function(s){
    const r = openRec(s.id);
    const recs = data.attend.filter(function(x){ return x.staffId===s.id && x.date===dk; });
    let mm=0; recs.forEach(function(x){ if(x.out) mm+=recMin(x); });
    html += '<div class="li"><div class="sp"><div class="li-t">'+esc(s.name)
      + (r?' <span class="bdg ok">근무중</span>':'')+'</div>'
      + '<div class="li-s">'+(recs.length
          ? recs.map(function(x){ return esc(x.in)+"~"+(x.out?esc(x.out):"…"); }).join(", ")+(mm?" · "+durTxt(mm):"")
          : "기록 없음")+'</div></div>'
      + '<button class="btn xs '+(r?'bad':'ok')+'" onclick="'+(r?'punchOut':'punchIn')+'(\''+s.id+'\')">'+(r?'퇴근':'출근')+'</button>'
      + '</div>';
  });
  html += '</div>';

  /* 그날 기록 목록 */
  const recs = data.attend.filter(function(r){ return r.date===dk; })
                          .sort(function(a,b){ return (a.in||"").localeCompare(b.in||""); });
  html += '<div class="card"><div class="row" style="margin-bottom:6px"><div class="sec-t sp" style="margin:0">📋 이 날 기록</div>'
    + (isMgr()? '<button class="btn xs g" onclick="editRec(null,\''+dk+'\')">+ 직접 추가</button>':'')+'</div>';
  if(!recs.length){ html += '<div class="empty">기록이 없어요</div>'; }
  else recs.forEach(function(r){
    const s = staffById(r.staffId); const c = recCalc(r);
    html += '<div class="li"><div class="sp"><div class="li-t">'+esc(s?s.name:"(삭제된 직원)")+'</div>'
      + '<div class="li-s">'+esc(r.in)+' ~ '+(r.out?esc(r.out):'<span style="color:var(--ok)">근무중</span>')
      + (num(r.brk)?' · 휴게 '+num(r.brk)+'분':'')
      + (r.out?' · <b>'+durTxt(c.total)+'</b>':'')
      + (c.night?' · <span class="bdg blue" style="padding:1px 6px">야간 '+durTxt(c.night)+'</span>':'')
      + (r.memo?'<br>📝 '+esc(r.memo):'')+'</div></div>'
      + (isMgr()? '<button class="btn xs g" onclick="editRec(\''+r.id+'\')">수정</button>':'')+'</div>';
  });
  if(recs.length){
    let sum=0; recs.forEach(function(r){ if(r.out) sum+=recMin(r); });
    html += '<div class="kv" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px">'
      + '<span>합계</span><b>'+durTxt(sum)+'</b></div>';
  }
  html += '</div>';
  return html;
}
function moveWorkDate(d){ workDate.setDate(workDate.getDate()+d); render(); }

/* 기록 추가/수정 */
function editRec(id, dk){
  const r = id ? data.attend.filter(function(x){ return x.id===id; })[0] : null;
  const opts = data.staff.map(function(s){
    return '<option value="'+s.id+'" '+(r&&r.staffId===s.id?'selected':'')+'>'+esc(s.name)+'</option>'; }).join("");
  const b = '<div class="f"><label>직원</label><select id="rSt">'+opts+'</select></div>'
    + '<div class="f"><label>날짜</label><input type="date" id="rDt" value="'+(r?r.date:(dk||today()))+'"></div>'
    + '<div class="grid3"><div class="f"><label>출근</label><input type="time" id="rIn" value="'+(r?r.in:"")+'"></div>'
    + '<div class="f"><label>퇴근</label><input type="time" id="rOut" value="'+(r&&r.out?r.out:"")+'"></div>'
    + '<div class="f"><label>휴게(분)</label><input type="number" id="rBrk" value="'+(r?num(r.brk):0)+'"></div></div>'
    + '<div class="f"><label>메모</label><input id="rMemo" value="'+(r?esc(r.memo):"")+'" placeholder="지각 / 연장 사유 등"></div>'
    + '<div class="muted" style="margin-bottom:12px">※ 퇴근이 출근보다 이르면 다음날로 자동 계산돼요 (야간 영업)</div>'
    + '<button class="btn full" onclick="saveRec(\''+(id||"")+'\')">저장</button>'
    + (id? '<button class="btn g full" style="margin-top:8px;color:var(--bad)" onclick="delRec(\''+id+'\')">삭제</button>':'');
  sheet(id?"근무기록 수정":"근무기록 추가", b);
}
function saveRec(id){
  const sid=document.getElementById("rSt").value, dt=document.getElementById("rDt").value;
  const i=document.getElementById("rIn").value, o=document.getElementById("rOut").value;
  if(!sid||!dt||!i){ toast("직원·날짜·출근시간은 필수예요"); return; }
  const brk=num(document.getElementById("rBrk").value), memo=document.getElementById("rMemo").value;
  let r = id ? data.attend.filter(function(x){ return x.id===id; })[0] : null;
  if(!r){ r={id:uid()}; data.attend.push(r); }
  r.staffId=sid; r.date=dt; r.in=i; r.out=o; r.brk=brk; r.memo=memo; r.by=meName();
  save(); closeSheet(); render(); toast("저장했어요 ✓");
}
function delRec(id){
  if(!confirm("이 근무기록을 삭제할까요?")) return;
  data.attend = data.attend.filter(function(x){ return x.id!==id; });
  save(); closeSheet(); render(); toast("삭제했어요");
}

/* ═══ 급여 ═══ */
function viewPay(){
  const m = payMonth;
  let html = '<div class="card tight"><div class="row">'
    + '<button class="btn g sm" onclick="payMonth=shiftMonth(payMonth,-1);render()">‹</button>'
    + '<div class="sp" style="text-align:center;font-weight:800">'+monthLabel(m)+'</div>'
    + '<button class="btn g sm" onclick="payMonth=shiftMonth(payMonth,1);render()">›</button></div></div>';

  const list = data.staff.filter(function(s){ return s.active!==false; });
  if(!list.length) return html+'<div class="card"><div class="empty">직원을 먼저 등록해 주세요</div></div>';

  let gross=0, net=0, mins=0;
  html += '<div class="card"><div class="sec-t">👥 직원별 급여</div>';
  list.forEach(function(s){
    const p = payroll(s, m);
    gross += p.gross; net += p.net; mins += p.totalMin;

/* ═══════════════ 매출 · 손익 ═══════════════ */
function salesOf(m){ return data.sales.filter(function(s){ return (s.date||"").slice(0,7)===m; }); }
function monthPL(m){
  const sales = salesOf(m);
  let rev=0; sales.forEach(function(s){ rev += num(s.amount); });
  let buy=0; data.moves.forEach(function(x){
    if(x.type==="in" && (x.date||"").slice(0,7)===m) buy += num(x.amt);
  });
  let labor=0, labMin=0;
  data.staff.forEach(function(s){ const p=payroll(s,m); labor += p.gross; labMin += p.totalMin; });
  const days = {}; sales.forEach(function(s){ days[s.date]=1; });
  return { rev:rev, buy:buy, labor:labor, labMin:labMin,
           days:Object.keys(days).length,
           profit: rev - buy - labor,
           laborPct: rev? labor/rev*100 : 0,
           buyPct:   rev? buy/rev*100 : 0 };
}
function viewPL(){
  const m = payMonth, p = monthPL(m);
  let html = '<div class="card tight"><div class="row">'

  html += '<div class="card"><div class="row" style="margin-bottom:8px">'
    + '<div class="sec-t sp" style="margin:0">💵 오늘 매출</div>'
    + '<button class="btn xs" onclick="editSale(null)">+ 매출 입력</button></div>'
    + '<div class="kv big"><span>'+dLabel(today())+'</span><b>'+won(todaySales())+'</b></div></div>';

  html += '<div class="card"><div class="sec-t">📊 '+monthLabel(m)+' 손익</div>'

    + '<div class="kv"><span>재료 매입</span><b>-'+won(p.buy)+(p.rev?' <span class="bdg '+(p.buyPct>40?"bad":p.buyPct>33?"warn":"ok")+'">'+p.buyPct.toFixed(1)+'%</span>':'')+'</b></div>'
    + '<div class="kv"><span>인건비 (세전)</span><b>-'+won(p.labor)+(p.rev?' <span class="bdg '+(p.laborPct>30?"bad":p.laborPct>25?"warn":"ok")+'">'+p.laborPct.toFixed(1)+'%</span>':'')+'</b></div>'
    + '<div class="kv big"><span>남는 돈 (임대료·공과금 전)</span><b style="color:'+(p.profit>=0?"var(--ok)":"var(--bad)")+'">'+won(p.profit)+'</b></div>'
    + '<div class="muted" style="margin-top:8px">※ 매입은 자재 입고 시 적은 결제금액, 인건비는 근무기록 기준이에요.<br>'
    + '일반적으로 식자재 30~35%, 인건비 25~30% 안쪽이면 양호합니다.</div></div>';

  const list = salesOf(m).slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  html += '<div class="card"><div class="sec-t">📅 일별 매출</div>';

          return '<button class="chip '+(cur===r?"on":"")+'" onclick="setRole(\''+s.id+'\',\''+r+'\')">'+ROLES[r].n+'</button>';
        }).join("")
      + '</div>'
      + '<div class="muted" style="margin-top:7px">'+ROLES[cur].d+'</div></div>';
  });
  b += '<div class="card"><div class="sec-t">📋 권한 요약</div>'
    + ["hall","kitchen","manager","admin"].map(function(r){
        const n = data.staff.filter(function(s){ return s.active!==false && roleOf(s)===r; }).length;
        return '<div class="li"><div class="sp"><div class="li-t">'+ROLES[r].n+' <span class="bdg">'+n+'명</span></div>'
          + '<div class="li-s">'+ROLES[r].d+'</div></div></div>';
      }).join("")+'</div>';
  sheet("🔑 권한 관리", b);
}
function setRole(id, r){
  const s = staffById(id); if(!s || !ROLES[r]) return;
  const cur = roleOf(s);
  if(cur===r) return;
  if(cur==="admin" && adminCount()<=1){
    toast("관리자가 최소 1명은 있어야 해요"); return;
  }
  if(r==="admin" && !confirm(s.name+" 님에게 관리자 권한을 줄까요?\n급여·손익·직원관리·설정을 모두 볼 수 있게 됩니다.")) return;
  if(r==="manager" && !confirm(s.name+" 님을 매니저로 지정할까요?\n단가·근무기록 수정·스케줄·매출 입력이 가능해집니다.")) return;
  s.role = r;
  save(); openRoles(); render();
  toast(s.name+" → "+ROLES[r].n);
}

/* ═══ 직원 관리 ═══ */
function viewStaff(){
  let html = '<div class="card"><div class="row" style="margin-bottom:6px">'
    + '<div class="sec-t sp" style="margin:0">👥 직원 목록</div>'
    + (isAdmin()?'<button class="btn xs" onclick="editStaff(null)">+ 직원 추가</button>':'')+'</div>'
    + (isAdmin()?'<button class="btn full sm blue" style="margin-bottom:10px" onclick="openRoles()">🔑 권한 관리 (역할·비밀번호)</button>':'');
  if(!data.staff.length) html += '<div class="empty">등록된 직원이 없어요.<br>+ 직원 추가를 눌러 등록하세요.</div>';
  data.staff.forEach(function(s){
    const p = payroll(s, monthKey(new Date()));
    html += '<div class="li"><div class="sp"><div class="li-t">'+esc(s.name)
      + (s.active===false?' <span class="bdg">퇴사</span>':'')
      + (s.id===meId?' <span class="bdg br">나</span>':'')+'</div>'
      + '<div class="li-s"><span class="bdg '+(roleLv(roleOf(s))>=2?"br":roleLv(roleOf(s))>=1?"blue":"")+'">'+roleName(roleOf(s))+'</span> '
      + (s.payType==="monthly"? "월급 "+won(num(s.monthly)) : "시급 "+won(num(s.wage)))
      + ' · '+({none:"공제없음","33":"3.3%",four:"4대보험"}[s.deduct||"none"])
      + (s.pin?' · 핀 설정됨':' · 핀 없음')
      + '<br>이번달 '+p.days+'일 / '+durTxt(p.totalMin)+'</div></div>'
      + (isAdmin()?'<button class="btn xs g" onclick="editStaff(\''+s.id+'\')">수정</button>':'')+'</div>';
  });
  html += '</div>';
  html += '<div class="card tight"><div class="muted">💡 직원 폰에서 이 앱을 열고 <b>👤 나</b>에서 본인 이름을 고르면, '
    + '홈 화면의 큰 출근/퇴근 버튼으로 직접 찍을 수 있어요. 핀번호를 설정하면 본인만 찍을 수 있습니다.</div></div>';
  return html;
}
function editStaff(id){
  const s = id? staffById(id) : null;
  const sel = function(v,cur){ return v===cur? 'selected':''; };
  const b = '<div class="f"><label>이름</label><input id="sN" value="'+(s?esc(s.name):"")+'" placeholder="홍길동"></div>'
    + '<div class="grid2">'
    + '<div class="f"><label>급여 형태</label><select id="sT" onchange="stPayType()">'
    + '<option value="hourly" '+sel("hourly",s?s.payType:"hourly")+'>시급제</option>'
    + '<option value="monthly" '+sel("monthly",s?s.payType:"")+'>월급제</option></select></div>'
    + '<div class="f" id="wrapWage"><label>시급 (원)</label><input type="number" id="sW" value="'+(s?num(s.wage):10320)+'"></div>'
    + '<div class="f" id="wrapMon" style="display:none"><label>월급 (원)</label><input type="number" id="sM" value="'+(s?num(s.monthly):0)+'"></div>'
    + '</div>'
    + '<div class="grid2">'
    + '<div class="f"><label>공제 방식</label><select id="sD">'
    + '<option value="none" '+sel("none",s?s.deduct:"none")+'>공제 없음</option>'
    + '<option value="33" '+sel("33",s?s.deduct:"")+'>3.3% 사업소득</option>'
    + '<option value="four" '+sel("four",s?s.deduct:"")+'>4대보험</option></select></div>'
    + '<div class="f"><label>핀번호 (4자리, 선택)</label><input id="sP" inputmode="numeric" maxlength="4" value="'+(s?esc(s.pin):"")+'" placeholder="예: 1234"></div>'
    + '</div>'
    + '<div class="grid2">'
    + '<div class="f"><label>야간수당 적용</label><select id="sNi"><option value="1" '+(s&&s.nightPay===false?"":"selected")+'>적용</option><option value="0" '+(s&&s.nightPay===false?"selected":"")+'>미적용</option></select></div>'
    + '<div class="f"><label>주휴수당 적용</label><select id="sWk"><option value="1" '+(s&&s.weeklyPay===false?"":"selected")+'>적용</option><option value="0" '+(s&&s.weeklyPay===false?"selected":"")+'>미적용</option></select></div>'
    + '</div>'
    + '<div class="f"><label>역할 (권한)</label><select id="sRole">'
    + ["hall","kitchen","manager","admin"].map(function(r){
        return '<option value="'+r+'" '+(roleOf(s||{})===r?"selected":"")+'>'+ROLES[r].n+' — '+ROLES[r].d+'</option>';
      }).join("")
    + '</select>'
    + '<div class="muted" style="margin-top:5px">🔒 매니저·관리자는 본인 핀번호(없으면 관리자 핀)를 넣어야 그 권한으로 들어갈 수 있어요.</div></div>'
    + '<div class="f"><label>메모</label><input id="sMemo" value="'+(s?esc(s.memo):"")+'" placeholder="입사일 / 비고"></div>'
    + (s? '<div class="f"><label>재직 상태</label><select id="sA"><option value="1" '+(s.active===false?"":"selected")+'>재직</option><option value="0" '+(s.active===false?"selected":"")+'>퇴사</option></select></div>':'')
    + (s? '<div class="card tight"><div class="row"><div class="sp"><div class="li-t">🔒 로그인 비밀번호</div>'
        + '<div class="li-s">'+(hasPw(s)? "설정됨 — 본인만 알아요" : "아직 없음 (첫 로그인 때 본인이 만듭니다)")+'</div></div>'
        + (hasPw(s)? '<button class="btn xs g" onclick="resetPw(\''+s.id+'\')">초기화</button>':'')
        + '</div></div>' : '')
    + '<button class="btn full" onclick="saveStaff(\''+(id||"")+'\')">저장</button>'
    + (id? '<button class="btn g full" style="margin-top:8px;color:var(--bad)" onclick="delStaff(\''+id+'\')">삭제</button>':'');
  sheet(id?"직원 정보 수정":"직원 추가", b);
  stPayType();
}
function stPayType(){
  const t=document.getElementById("sT"); if(!t) return;
  document.getElementById("wrapWage").style.display = t.value==="hourly"?"":"none";
  document.getElementById("wrapMon").style.display  = t.value==="monthly"?"":"none";
}
function saveStaff(id){
  const n=document.getElementById("sN").value.trim();
  if(!n){ toast("이름을 입력하세요"); return; }
  let s = id? staffById(id) : null;
  if(!s){ s={id:uid()}; data.staff.push(s); }
  s.name=n;
  s.payType=document.getElementById("sT").value;
  s.wage=num(document.getElementById("sW").value);
  s.monthly=num(document.getElementById("sM").value);
  s.deduct=document.getElementById("sD").value;
  s.pin=document.getElementById("sP").value.trim();
  s.nightPay=document.getElementById("sNi").value==="1";
  s.weeklyPay=document.getElementById("sWk").value==="1";
  s.role=document.getElementById("sRole").value;
  s.memo=document.getElementById("sMemo").value;
  const a=document.getElementById("sA"); if(a) s.active = a.value==="1";
  save(); closeSheet(); render(); toast("저장했어요 ✓");
}
function delStaff(id){
  if(!confirm("직원을 삭제하면 근무기록은 남지만 이름이 사라져요. 삭제할까요?\n(퇴사 처리를 권장합니다)")) return;
  data.staff = data.staff.filter(function(s){ return s.id!==id; });
  if(meId===id){ meId=""; lsDel("sm-me"); }
  save(); closeSheet(); render();
}
</script>
<script>
/* ═══════════════ 레시피 ═══════════════ */
function recipeCats(){
  const set={}; data.recipes.forEach(function(r){ if(r.cat) set[r.cat]=1; });
  return Object.keys(set);
}
function viewRecipe(){
  const cats = ["전체"].concat(recipeCats());
  let html = '<div class="row" style="margin-bottom:10px">'
    + '<input id="rq" class="sp" placeholder="🔍 메뉴·재료 검색" value="'+esc(recipeQ)+'" oninput="recipeQ=this.value;renderRecipeList()">'
    + '<button class="btn sm" onclick="editRecipe(null)">+ 추가</button></div>'
    + '<button class="btn full sm blue" style="margin-bottom:10px" onclick="quickSheet()">⚡ 붙여넣기로 빠르게 작성</button>';
  html += '<div class="chips">'+cats.map(function(c){
      return '<button class="chip '+(recipeCat===c?"on":"")+'" onclick="recipeCat=\''+jsq(c)+'\';render()">'+esc(c)+'</button>';
    }).join("")+'</div>';
  if(data.recipes.length){
    html += '<div class="row" style="margin-bottom:10px">'
      + '<div class="muted sp">'+(recipeCat==="전체"?"전체":esc(recipeCat))+' 레시피를 한 번에 출력</div>'
      + '<button class="btn sm blue" onclick="printCurrentList()">🖨️ 레시피북 인쇄</button></div>';
  }
  html += '<div id="rlist">'+recipeListHtml()+'</div>';
  return html;
}
function renderRecipeList(){ const el=document.getElementById("rlist"); if(el) el.innerHTML=recipeListHtml(); }
function filteredRecipes(){
  const q = recipeQ.trim().toLowerCase();
  const list = data.recipes.filter(function(r){
    if(recipeCat!=="전체" && r.cat!==recipeCat) return false;
    if(!q) return true;
    if((r.name||"").toLowerCase().indexOf(q)>=0) return true;
    return (r.ings||[]).some(function(g){ return (g.name||"").toLowerCase().indexOf(q)>=0; });
  });
  list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
  return list;
}
function recipeListHtml(){
  const list = filteredRecipes();
  if(!list.length) return '<div class="card"><div class="empty">레시피가 없어요.<br>+ 추가를 눌러 첫 레시피를 만들어 보세요.</div></div>';
  let h = "";
  list.forEach(function(r){
    h += '<div class="card" onclick="showRecipe(\''+r.id+'\')">'
      + '<div class="row top"><div class="sp"><div style="font-size:16px;font-weight:800">'+esc(r.name)+'</div>'
      + '<div class="li-s">'+(r.cat?'<span class="bdg br">'+esc(r.cat)+'</span> ':'')
      + (r.yield?esc(r.yield)+' · ':'')+(r.ings||[]).length+'개 재료 · '+(r.steps||[]).length+'단계</div></div>'
      + '<span class="bdg">보기 ›</span></div></div>';
  });
  return h;
}
function showRecipe(id){
  const r = recipeById(id); if(!r) return;
  let b = '<div class="card"><div class="row top"><div class="sp">'
    + '<div style="font-size:18px;font-weight:800">'+esc(r.name)+'</div>'
    + '<div class="li-s">'+(r.cat?'<span class="bdg br">'+esc(r.cat)+'</span> ':'')+(r.yield?esc(r.yield):'')+'</div></div>'
    + (canRecipe()?'<button class="btn sm" onclick="editRecipe(\''+r.id+'\')">✏️ 수정</button>':'')
    + '</div></div>';

  b += '<div class="card"><div class="row" style="margin-bottom:6px"><div class="sec-t sp" style="margin:0">🥕 재료</div>'
    + (canRecipe()?'<button class="btn xs g" onclick="editRecipe(\''+r.id+'\')">✏️ 재료 고치기</button>':'')+'</div>';
  if(!(r.ings||[]).length) b += '<div class="muted">등록된 재료가 없어요</div>';
  (r.ings||[]).forEach(function(g){
    const it = g.sid? stockById(g.sid):null;
    const cv = convHint(g);
    b += '<div class="li"><div class="sp"><div class="li-t">'+esc(g.name)+'</div>'
      + (it?'<div class="li-s">창고 재고 '+num(it.stock)+esc(it.unit||"")
           +(num(it.perUnit)&&it.useUnit? ' (='+Math.round(num(it.stock)*num(it.perUnit)*10)/10+esc(it.useUnit)+')':'')
           +(isLow(it)?' <span class="bdg bad">부족</span>':'')+'</div>':'')
      + '</div><div style="text-align:right"><b>'+num(g.qty)+esc(g.unit||"")+'</b>'
      + (cv?'<div class="li-s">'+esc(cv)+'</div>':'')+'</div></div>';
  });
  b += '</div>';

  b += '<div class="card"><div class="row" style="margin-bottom:6px"><div class="sec-t sp" style="margin:0">👨‍🍳 조리 순서</div>'
    + (canRecipe()?'<span class="muted">단계를 눌러 수정</span>':'')+'</div>';
  if(!(r.steps||[]).length) b += '<div class="muted">등록된 순서가 없어요</div>';
  (r.steps||[]).forEach(function(s,i){
    b += '<div class="step" '+(canRecipe()?'onclick="editStepQuick(\''+r.id+'\','+i+')"':'')+'>'
      + '<div class="step-n">'+(i+1)+'</div><div class="sp">'+esc(s).replace(/\n/g,"<br>")+'</div>'
      + (canRecipe()?'<span class="muted">✏️</span>':'')+'</div>';
  });
  if(canRecipe()) b += '<button class="btn g full sm" style="margin-top:9px" onclick="addStepQuick(\''+r.id+'\')">+ 단계 추가</button>';
  b += '</div>';

  if(r.tip || canRecipe())
    b += '<div class="card"><div class="row" style="margin-bottom:6px"><div class="sec-t sp" style="margin:0">💡 포인트 · 주의</div>'
      + (canRecipe()?'<button class="btn xs g" onclick="editTipQuick(\''+r.id+'\')">✏️</button>':'')+'</div>'
      + '<div>'+(r.tip? esc(r.tip).replace(/\n/g,"<br>") : '<span class="muted">아직 없어요</span>')+'</div></div>';

  b += '<button class="btn g full sm" style="margin-bottom:9px" onclick="dupRecipe(\''+r.id+'\')">📄 이 레시피로 새로 만들기 (복제)</button>'
    + '<div class="grid3"><button class="btn g" onclick="copyRecipe(\''+r.id+'\')">📋 복사</button>'
    + '<button class="btn blue" onclick="printDlg([\''+r.id+'\'])">🖨️ 인쇄</button>'
    + '<button class="btn" onclick="editRecipe(\''+r.id+'\')">✏️ 수정</button></div>'
    + '<div class="muted" style="text-align:center;margin-top:10px">'+(r.by?'작성 '+esc(r.by)+' · ':'')+(r.updated||"")+'</div>';
  sheet("레시피", b);
}
/* ═══ 부분 수정 (레시피 전체 편집 없이 한 군데만) ═══ */
function editStepQuick(id, i){
  const r=recipeById(id); if(!r) return;
  const cur=(r.steps||[])[i]; if(cur===undefined) return;
  const b = '<div class="card tight"><div class="muted">'+esc(r.name)+' · '+(i+1)+'번째 단계</div></div>'
    + '<div class="f"><label>조리 내용</label><textarea id="sqT" style="min-height:90px">'+esc(cur)+'</textarea></div>'
    + '<div class="grid2" style="margin-bottom:10px">'
    + '<button class="btn g sm" '+(i===0?'style="opacity:.4"':'')+' onclick="moveStepQuick(\''+id+'\','+i+',-1)">↑ 위로</button>'
    + '<button class="btn g sm" '+(i===r.steps.length-1?'style="opacity:.4"':'')+' onclick="moveStepQuick(\''+id+'\','+i+',1)">↓ 아래로</button></div>'
    + '<button class="btn full" onclick="saveStepQuick(\''+id+'\','+i+')">저장</button>'
    + '<button class="btn g full" style="margin-top:8px;color:var(--bad)" onclick="delStepQuick(\''+id+'\','+i+')">이 단계 삭제</button>';
  sheet("단계 수정", b);
}
function saveStepQuick(id,i){
  const r=recipeById(id); if(!r) return;
  const v=(document.getElementById("sqT")||{}).value||"";
  if(!v.trim()){ toast("내용을 입력하세요"); return; }
  r.steps[i]=v.trim(); r.updated=today(); r.by=meName();
  save(); showRecipe(id); toast("수정했어요 ✓");
}
function moveStepQuick(id,i,d){
  const r=recipeById(id); if(!r) return;
  const j=i+d; if(j<0||j>=r.steps.length) return;
  const t=r.steps[i]; r.steps[i]=r.steps[j]; r.steps[j]=t;
  r.updated=today(); save(); editStepQuick(id,j);
}
function delStepQuick(id,i){
  const r=recipeById(id); if(!r) return;
  if(!confirm((i+1)+"번째 단계를 삭제할까요?")) return;
  r.steps.splice(i,1); r.updated=today();
  save(); showRecipe(id); toast("삭제했어요");
}
function addStepQuick(id){
  const r=recipeById(id); if(!r) return;
  const v=prompt("추가할 조리 단계를 입력하세요");
  if(v===null || !v.trim()) return;
  r.steps=(r.steps||[]).concat(v.trim()); r.updated=today(); r.by=meName();
  save(); showRecipe(id); toast("단계를 추가했어요 ✓");
}
function editTipQuick(id){
  const r=recipeById(id); if(!r) return;
  const b = '<div class="f"><label>포인트 · 주의사항</label>'
    + '<textarea id="tqT" style="min-height:110px" placeholder="불 세기, 간 맞추는 팁, 보관법 등">'+esc(r.tip||"")+'</textarea></div>'
    + '<button class="btn full" onclick="saveTipQuick(\''+id+'\')">저장</button>';
  sheet("포인트 수정", b);
}
function saveTipQuick(id){
  const r=recipeById(id); if(!r) return;
  r.tip=(document.getElementById("tqT")||{}).value||"";
  r.updated=today(); r.by=meName();
  save(); showRecipe(id); toast("저장했어요 ✓");
}
function dupRecipe(id){
  const r=recipeById(id); if(!r) return;
  editRecipe(null, {
    name: r.name+" (복사)", cat:r.cat, yield:r.yield, tip:r.tip,
    ings: JSON.parse(JSON.stringify(r.ings||[])), steps:(r.steps||[]).slice()
  });
  toast("복제했어요 — 이름과 재료를 고쳐 저장하세요");
}
function copyRecipe(id){
  const r=recipeById(id); if(!r) return;
  let t = "🍳 "+r.name+(r.yield?" ("+r.yield+")":"")+"\n";
  t += "─────────────────\n[재료]\n";
  (r.ings||[]).forEach(function(g){ t += "· "+g.name+" "+num(g.qty)+(g.unit||"")+"\n"; });
  t += "\n[조리 순서]\n";
  (r.steps||[]).forEach(function(s,i){ t += (i+1)+". "+s+"\n"; });
  if(r.tip) t += "\n[포인트]\n"+r.tip+"\n";
  copyTxt(t.trim());
}

/* ═══ 인쇄 ═══ */
function printSheetHtml(r){
  let h = '<div class="p-sheet">'
    + '<div class="p-store">'+esc(data.settings.store||"")+'</div>'
    + '<div class="p-h1">'+esc(r.name)+'</div>'
    + '<div class="p-sub">'+(r.cat?esc(r.cat)+' · ':'')+(r.yield?esc(r.yield):'')+'</div>'
    + '<hr class="p-rule">';
  if((r.ings||[]).length){
    h += '<div class="p-h2">재료</div><table class="p-ings">';
    r.ings.forEach(function(g){
      h += '<tr><td>'+esc(g.name)+'</td><td class="q">'+num(g.qty)+esc(g.unit||"")+'</td></tr>';
    });
    h += '</table>';
  }
  if((r.steps||[]).length){
    h += '<div class="p-h2">조리 순서</div>';
    r.steps.forEach(function(s,i){
      h += '<div class="p-step"><b>'+(i+1)+'</b><div>'+esc(s).replace(/\n/g,"<br>")+'</div></div>';
    });
  }
  if(r.tip) h += '<div class="p-tip"><b>포인트 · 주의</b><br>'+esc(r.tip).replace(/\n/g,"<br>")+'</div>';

/* ═══ 빠른 작성 (통째로 붙여넣기 → 자동 분리) ═══ */
const QUICK_SAMPLE = "매운 오뎅탕\n2인분\n\n[재료]\n부산옛날어묵 2봉\n무 0.5개\n대파 1대\n고춧가루 30g\n\n[순서]\n육수 1.2L를 끓인다\n무를 나박 썰어 10분 끓인다\n어묵을 넣고 5분 더\n고춧가루로 매운 양념을 푼다\n\n[팁]\n고춧가루는 마지막에 풀어야 텁텁하지 않음";
function quickSheet(){

    + '구분이 없으면 “이름 + 수량”처럼 생긴 줄은 재료로, 나머지는 조리순서로 나눕니다.</div>';

function quickFill(t){ const el=document.getElementById("qTxt"); if(el) el.value=t; }
function matchStock(name){
  const n=String(name||"").trim();
  if(!n) return null;
  let hit = data.stock.filter(function(i){ return i.name===n; })[0];
  if(hit) return hit;
  const part = data.stock.filter(function(i){
    return i.name.indexOf(n)>=0 || n.indexOf(i.name)>=0;
  });
  return part.length===1 ? part[0] : null;   /* 애매하면 연결하지 않음 */
}
function quickParse(raw){
  const out={ name:"", cat:"", yield:"", ings:[], steps:[], tip:"" };
  const lines = String(raw||"").split(/\r?\n/);
  let mode="head";
  lines.forEach(function(ln){
    let s = ln.trim();
    if(!s) return;
    const head = s.replace(/[\[\]()【】]/g,"").trim();
    if(/^재료/.test(head) && head.length<=6){ mode="ing"; return; }
    if(/^(조리|순서|만드는|레시피|조리순서|만드는법)/.test(head) && head.length<=8){ mode="step"; return; }
    if(/^(팁|포인트|주의|비고)/.test(head) && head.length<=8){ mode="tip"; return; }
    s = s.replace(/^[-·•*•]\s*/,"").replace(/^\d+[.)]\s*/,"");
    if(!s) return;

    if(mode==="head"){
      if(!out.name){ out.name=s; return; }
      if(!out.yield && /(인분|인용|그릇|판|접시|kg|L)/.test(s) && s.length<=10){ out.yield=s; return; }
      mode="auto";
    }
    if(mode==="ing"){
      const m = s.match(/^(.+?)\s+([0-9]+(?:[.,][0-9]+)?)\s*([^\s0-9]{0,4})$/);
      if(m) out.ings.push({ name:m[1].trim(), qty:num(m[2].replace(",",".")), unit:(m[3]||"").trim() });
      else  out.ings.push({ name:s, qty:"", unit:"" });
      return;
    }
    if(mode==="tip"){ out.tip += (out.tip?"\n":"")+s; return; }

    /* [순서]로 명시된 줄은 무조건 조리순서 */
    if(mode==="step"){ out.steps.push(s); return; }

    /* 구분 없이 쓴 경우: 짧고 수량으로 끝나면 재료로 본다 (시간·동작 표현은 제외) */
    const g = s.match(/^(.{1,14}?)\s+([0-9]+(?:[.,][0-9]+)?)\s*([^\s0-9]{0,4})$/);
    const timeish = g && /^(분|초|시간|회|번|도|인분)$/.test((g[3]||"").trim());
    const verbish = /(다|요|자|세요|시오)$/.test(s);
    if(g && s.length<=22 && !timeish && !verbish)
      out.ings.push({ name:g[1].trim(), qty:num(g[2].replace(",",".")), unit:(g[3]||"").trim() });
    else out.steps.push(s);
  });
  /* 자재와 자동 연결 */
  out.ings.forEach(function(g){
    const it = matchStock(g.name);
    if(it){ g.sid=it.id; g.name=it.name; if(!g.unit) g.unit=it.unit||""; }
    else g.sid="";
  });
  return out;
}
function quickGo(){
  const t=document.getElementById("qTxt").value;
  if(!t.trim()){ toast("내용을 붙여넣어 주세요"); return; }
  const p=quickParse(t);
  if(!p.name){ toast("메뉴 이름을 찾지 못했어요. 첫 줄에 메뉴명을 적어주세요"); return; }

}

/* 재료 선택 목록 — 분류별로 묶고 각 분류 안은 가나다순 */
function stockOptions(sel){
  let o = '<option value="">직접 입력</option>';
  const groups={}, order=[];
  data.stock.slice()
    .sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","ko"); })
    .forEach(function(i){
      const g = i.cat || "기타";
      if(!groups[g]){ groups[g]=[]; order.push(g); }
      groups[g].push(i);
    });
  order.sort(function(a,b){
    if(a==="기타") return 1;
    if(b==="기타") return -1;
    return a.localeCompare(b,"ko");
  });
  order.forEach(function(g){
    o += '<optgroup label="'+esc(g)+'">';
    groups[g].forEach(function(i){
      o += '<option value="'+i.id+'" '+(sel===i.id?"selected":"")+'>'
        +  esc(i.name)+(i.unit?' ('+esc(i.unit)+')':'')+'</option>';
    });
    o += '</optgroup>';
  });
  return o;
}
function drawIngs(){

/* 자재를 고르면 '사용 단위'(있으면)를 기본으로 넣는다 */
function useUnitOf(it){ return (it && it.useUnit) ? it.useUnit : (it? (it.unit||"") : ""); }
function pickIng(i,sid){
  tmpIngs[i].sid = sid;
  if(sid){
    const it=stockById(sid);
    if(it){ tmpIngs[i].name=it.name; tmpIngs[i].unit = useUnitOf(it); }
  }
  drawIngs();
}
function setIngUnit(i,u){ tmpIngs[i].unit=u; drawIngs(); }
/* 사용량 → 구매 단위 환산 (1봉=20장 같은 값이 있을 때만) */
function convHint(g){
  if(!g || !g.sid) return "";
  const it = stockById(g.sid);
  if(!it || !num(it.perUnit) || !num(g.qty)) return "";
  if(!it.useUnit || g.unit !== it.useUnit) return "";
  const v = num(g.qty)/num(it.perUnit);
  return "≈ "+(Math.round(v*100)/100)+(it.unit||"");
}
/* 자주 쓰는 재료 = 레시피에 많이 쓰인 순 → 부족하면 최근 입고한 자재로 채움 */
function favStock(){
  const cnt={};
  data.recipes.forEach(function(r){ (r.ings||[]).forEach(function(g){ if(g.sid) cnt[g.sid]=(cnt[g.sid]||0)+1; }); });
  const used = Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; });
  const recent = data.moves.slice().reverse()
    .filter(function(m){ return m.type==="in"; })
    .map(function(m){ return m.itemId; });
  const out=[], seen={};
  used.concat(recent).forEach(function(id){
    if(seen[id] || !stockById(id)) return;
    seen[id]=1; out.push(id);
  });
  data.stock.forEach(function(i){ if(!seen[i.id]){ seen[i.id]=1; out.push(i.id); } });
  return out.slice(0,12).map(stockById).filter(function(i){ return i; });
}
function drawFavs(){
  const box=document.getElementById("favBox"); if(!box) return;
  const favs=favStock();

    ? favs.map(function(i){

function saveRecipe(){
  const n=document.getElementById("cN").value.trim();
  if(!n){ toast("메뉴 이름을 입력하세요"); return; }
  let r = editingRecipe? recipeById(editingRecipe):null;

                  .map(function(g){ return {sid:g.sid,name:g.name.trim(),qty:num(g.qty),unit:g.unit}; });
  r.steps = tmpSteps.map(function(s){ return s.trim(); }).filter(function(s){ return s; });

function delRecipe(id){

function pickUnit(u){

function isLow(i){ return num(i.min)>0 && num(i.stock) <= num(i.min); }

/* ═══ 재고 실사 · 최소보유량 일괄 입력 ═══ */
let bulkMode = "stock";   // stock | min | exp
let bulkOnlyEmpty = false;

/* 유통기한 빠른 입력 — 오늘부터 며칠 뒤로 채움 */
function expQuick(bid, days){
  const el = document.querySelector('#shBody [data-bid="'+bid+'"]');
  if(!el) return;

  else { const d=new Date(); d.setDate(d.getDate()+days); el.value=dateKey(d); }
}
function expQuickFor(elId, days){
  const el = document.getElementById(elId);

  else { const d=new Date(); d.setDate(d.getDate()+days); el.value=dateKey(d); }

/* 유통기한 빠른 선택 버튼 (오늘부터 +N일) */
const EXP_QUICKS = [[3,"+3일"],[5,"+5일"],[7,"+1주"],[14,"+2주"],
                    [30,"+1개월"],[90,"+3개월"],[180,"+6개월"]];
function expQuickChips(elId){
  return '<div class="chips wrap" style="margin-top:7px">'
    + EXP_QUICKS.map(function(q){
        return '<button class="chip" onclick="expQuickFor(\''+elId+'\','+q[0]+')">'+q[1]+'</button>';
      }).join("")
    + '<button class="chip" onclick="expQuickFor(\''+elId+'\',null)">지움</button></div>';

function bulkSheet(mode){
  bulkMode = mode || "stock";
  const title = {stock:"재고 실사 (한 번에 입력)", min:"최소 보유량 한 번에 설정", exp:"유통기한 한 번에 입력"}[bulkMode];
  let b = '<div class="seg">'
    + [["stock","📐 재고"],["min","⚠️ 최소보유"],["exp","📅 유통기한"]].map(function(s){
        return '<button class="'+(bulkMode===s[0]?"on":"")+'" onclick="bulkSheet(\''+s[0]+'\')">'+s[1]+'</button>';
      }).join("")+'</div>';
  b += '<div class="card tight"><div class="muted">'
    + {stock:"실제로 세어본 수량을 적으세요. 빈 칸은 그대로 둡니다.",
       min:"이 수량 이하로 떨어지면 발주 알림이 떠요. 자주 나가는 것부터 채우세요.",
       exp:"가장 임박한 유통기한을 적으세요. 임박하면 홈에 알림이 뜹니다."}[bulkMode]
    + '</div></div>';

  if(bulkMode==="exp"){
    b += '<div class="row" style="margin-bottom:10px"><div class="muted sp">보기</div>'
      + '<button class="chip '+(bulkOnlyEmpty?"":"on")+'" onclick="bulkOnlyEmpty=false;bulkSheet(\'exp\')">전체</button>'
      + '<button class="chip '+(bulkOnlyEmpty?"on":"")+'" onclick="bulkOnlyEmpty=true;bulkSheet(\'exp\')">미입력만</button></div>';
  }
  let list = data.stock.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","ko"); });
  if(bulkMode==="exp" && bulkOnlyEmpty) list = list.filter(function(i){ return !i.exp; });

  const groups={}, order=[];
  list.forEach(function(i){
    const g=i.cat||"기타";
    if(!groups[g]){ groups[g]=[]; order.push(g); }
    groups[g].push(i);
  });
  order.sort(function(a,b){ return a.localeCompare(b,"ko"); });
  if(!order.length) b += '<div class="card"><div class="empty">해당하는 자재가 없어요</div></div>';
  order.forEach(function(g){
    b += '<div class="card"><div class="sec-t">'+esc(g)+' ('+groups[g].length+')</div>';
    groups[g].forEach(function(i){
      if(bulkMode==="exp"){
        b += '<div style="padding:10px 0;border-bottom:1px solid var(--line)">'
          + '<div class="row"><div class="sp"><div class="li-t">'+esc(i.name)+'</div>'
          + '<div class="li-s">재고 '+num(i.stock)+esc(i.unit||"")
          + (i.exp?' · 현재 '+esc(i.exp)+' ('+expLabel(i.exp)+')':'')+'</div></div>'
          + '<input type="date" data-bid="'+i.id+'" value="'+esc(i.exp||"")+'" style="width:145px"></div>'
          + '<div class="chips wrap" style="margin-top:7px">'
          + EXP_QUICKS.map(function(q){
              return '<button class="chip" onclick="expQuick(\''+i.id+'\','+q[0]+')">'+q[1]+'</button>';
            }).join("")
          + '<button class="chip" onclick="expQuick(\''+i.id+'\',null)">지움</button></div></div>';
      } else {
        const val = bulkMode==="stock"? num(i.stock) : num(i.min);
        b += '<div class="li"><div class="sp"><div class="li-t">'+esc(i.name)+'</div>'
          + '<div class="li-s">현재 '+num(i.stock)+esc(i.unit||"")+(num(i.min)?' / 최소 '+num(i.min):'')+'</div></div>'
          + '<input type="number" step="any" inputmode="decimal" data-bid="'+i.id+'" value="'+val+'" style="width:88px;text-align:right">'
          + '</div>';
      }
    });
    b += '</div>';
  });
  b += '<button class="btn full ok" onclick="bulkSave()">전체 저장</button>';
  sheet(title, b);
}
function bulkSave(){
  const els = document.getElementById("shBody").querySelectorAll("[data-bid]");
  let n=0;
  for(let k=0;k<els.length;k++){
    const el=els[k], it=stockById(el.dataset.bid);
    if(!it) continue;
    if(bulkMode==="exp"){
      if((it.exp||"") !== el.value){ it.exp=el.value; n++; }
    } else {
      if(el.value==="") continue;
      const v=num(el.value);
      if(bulkMode==="stock"){
        if(num(it.stock)!==v){
          data.moves.push({ id:uid(), itemId:it.id, type:"adj", qty:v, amt:0,
                            date:today(), memo:"재고 실사", by:meName() });
          it.stock=v; n++;
        }
      } else {
        if(num(it.min)!==v){ it.min=v; n++; }
      }
    }
  }
  save(); closeSheet(); render();
  toast(n? (n+"개 저장했어요 ✓") : "바뀐 내용이 없어요");
}

/* 유통기한 임박 (기본 7일 이내) */
function expSoon(days){
  const lim = new Date(); lim.setDate(lim.getDate()+(days===undefined?7:days));
  const limK = dateKey(lim), t = today();
  return data.stock.filter(function(i){ return i.exp && i.exp <= limK; })
    .map(function(i){ return { item:i, past: i.exp < t }; })
    .sort(function(a,b){ return (a.item.exp||"").localeCompare(b.item.exp||""); });
}
function expLabel(d){
  if(!d) return "";
  const t=today();
  if(d < t) return "지남";
  if(d === t) return "오늘";
  const diff = Math.round((new Date(d) - new Date(t))/86400000);
  return "D-"+diff;
}

function renderStockList(){ const el=document.getElementById("slist"); if(el) el.innerHTML=stockListHtml(); }
function stockListHtml(){
  const q=stockQ.trim().toLowerCase();
  let list = data.stock.filter(function(i){
    if(stockCat!=="전체" && i.cat!==stockCat) return false;
    if(!q) return true;
    return (i.name||"").toLowerCase().indexOf(q)>=0 || (i.vendor||"").toLowerCase().indexOf(q)>=0;
  });
  const byName = function(a,b){ return (a.name||"").localeCompare(b.name||"","ko"); };
  if(stockSort==="name"){
    list.sort(byName);
  } else if(stockSort==="cat"){
    list.sort(function(a,b){
      const ca=a.cat||"힣기타", cb=b.cat||"힣기타";
      if(ca!==cb) return ca.localeCompare(cb,"ko");
      return byName(a,b);
    });
  } else {
    list.sort(function(a,b){
      if(isLow(a)!==isLow(b)) return isLow(a)?-1:1;
      return byName(a,b);
    });
  }
  if(!list.length) return '<div class="card"><div class="empty">자재가 없어요.<br>+ 추가로 자주 쓰는 재료부터 등록해 보세요.</div></div>';
  let h='<div class="card">', lastCat=null;
  list.forEach(function(i){
    if(stockSort==="cat"){
      const c=i.cat||"기타";
      if(c!==lastCat){ lastCat=c;
        h += '<div class="sec-t" style="margin:12px 0 2px">'+esc(c)+'</div>'; }
    }
    h += '<div class="li"><div class="sp" onclick="showItem(\''+i.id+'\')">'
      + '<div class="li-t">'+esc(i.name)+(isLow(i)?' <span class="bdg bad">부족</span>':'')+'</div>'
      + '<div class="li-s">재고 <b>'+num(i.stock)+esc(i.unit||"")+'</b>'+(num(i.perUnit)&&i.useUnit? ' (='+(Math.round(num(i.stock)*num(i.perUnit)*10)/10)+esc(i.useUnit)+')':'')
      + (num(i.min)?' / 최소 '+num(i.min)+esc(i.unit||""):'')
      + (canCost()&&num(i.price)?' · '+won(num(i.price))+'/'+esc(i.unit||"단위"):'')
      + (i.vendor?' · '+esc(i.vendor):'')+(i.exp?' · 📅 '+esc(i.exp)+' <span class="bdg '+(i.exp<today()?'bad':expLabel(i.exp).indexOf('D-')===0&&parseInt(expLabel(i.exp).slice(2))<=7?'warn':'')+'">'+expLabel(i.exp)+'</span>':'')+'</div></div>'

      + '<button class="btn xs g" onclick="moveDlg(\''+i.id+'\',\'out\')">-사용</button></div>';

function doMove(id,type){
  const i=stockById(id); if(!i) return;
  const q=num(document.getElementById("mQ").value);
  const d=document.getElementById("mD").value||today();
  const memo=document.getElementById("mM").value;
  if(!q && type!=="adj"){ toast("수량을 입력하세요"); return; }
  let logQty=q, amt=0;
  if(type==="in"){
    const aEl=document.getElementById("mA"); amt=num(aEl?aEl.value:0);
    const eEl=document.getElementById("mE"); if(eEl) i.exp = eEl.value;
    i.stock = num(i.stock)+q;
    if(amt>0 && q>0) i.price = Math.round(amt/q);
  } else if(type==="out"){
    i.stock = num(i.stock)-q;
  } else {
    logQty = q; i.stock = q;
  }
  data.moves.push({ id:uid(), itemId:id, type:type, qty:logQty, amt:amt, date:d, memo:memo, by:meName() });
  save(); closeSheet(); render();
  toast(i.name+" "+({in:"입고",out:"사용",adj:"실사"}[type])+" ✓ 현재 "+num(i.stock)+(i.unit||""));
}
